<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2B1D14">
<title>لوحة الفرع — بن الغرباوي</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');

:root{
  --bg:#FAF6F0; --surface:#FFFFFF; --subtle:#F5EEE5;
  --text:#1F1611; --muted:#8A7566; --border:#E8DED2;
  --gold:#C89B5E; --gold-2:#E0BE85; --dark:#2B1D14;
  --danger:#B33A3A; --success:#4A7C59; --info:#2980b9; --warn:#E0A100;
  --shadow:0 2px 10px rgba(43,29,20,.05);
  --shadow-lg:0 18px 50px rgba(43,29,20,.14);
  --r:16px;
}
html.dark{
  --bg:#16100D; --surface:#211813; --subtle:#1A130F;
  --text:#FAF6F0; --muted:#9E8B7D; --border:#36271E;
  --gold:#D4A56A; --gold-2:#E0BE85; --dark:#FAF6F0;
  --shadow:0 2px 10px rgba(0,0,0,.3);
  --shadow-lg:0 18px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{overscroll-behavior-y:contain}
body{
  font-family:'Cairo',system-ui,sans-serif; background:var(--bg); color:var(--text);
  margin:0; min-height:100vh; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
img{max-width:100%}

/* ---------- Boot / Fatal ---------- */
.boot{
  position:fixed; inset:0; z-index:500; display:grid; place-items:center; gap:14px;
  background:var(--bg); text-align:center; padding:24px;
}
.boot-mark{font-size:44px; animation:float 2s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.boot p{color:var(--muted); font-size:13px; font-weight:700; margin:0}
.spinner{
  width:26px;height:26px;border-radius:50%;
  border:3px solid var(--border); border-top-color:var(--gold);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.fatal{
  position:fixed; inset:0; z-index:500; display:grid; place-items:center;
  background:var(--bg); padding:24px; text-align:center;
}
.fatal-box{
  max-width:420px; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:34px 28px; box-shadow:var(--shadow-lg);
}
.fatal-box .big{font-size:48px; margin-bottom:8px}
.fatal-box h2{margin:0 0 8px; font-size:19px; font-weight:900}
.fatal-box p{margin:0 0 20px; color:var(--muted); font-size:13px; line-height:1.8}

/* ---------- Login ---------- */
.login{
  min-height:100vh; display:grid; place-items:center; padding:24px;
  background:
    radial-gradient(900px 500px at 100% 0%, rgba(200,155,94,.16), transparent 60%),
    var(--bg);
}
.login-card{
  width:min(400px,100%); background:var(--surface); border:1px solid var(--border);
  border-radius:24px; padding:34px 28px; box-shadow:var(--shadow-lg);
}
.login-mark{
  width:64px;height:64px;border-radius:20px;margin:0 auto 14px;
  display:grid;place-items:center;font-size:30px;
  background:linear-gradient(145deg,var(--gold),var(--gold-2));
  box-shadow:0 12px 30px rgba(200,155,94,.35);
}
.login-card h1{text-align:center; font-size:20px; margin:0 0 6px; font-weight:900}
.login-card .sub{text-align:center; color:var(--muted); font-size:12.5px; margin:0 0 24px}

.field{display:block; margin-bottom:14px}
.field span.lbl{display:block; font-size:11px; font-weight:800; color:var(--muted); margin-bottom:6px}
.field input{
  width:100%; padding:13px 14px; border-radius:12px; border:1.5px solid var(--border);
  background:var(--subtle); color:var(--text); font-family:inherit; font-size:14px; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.field input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(200,155,94,.16)}
.pass-wrap{position:relative; display:block}
.pass-wrap input{padding-inline-end:46px}
.pass-wrap button{
  position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%);
  width:34px; height:34px; border-radius:9px; border:0; background:transparent;
  color:var(--muted); cursor:pointer; font-size:15px;
}
.pass-wrap button:hover{background:var(--surface)}

.form-error{min-height:18px; margin:4px 0 0; color:var(--danger); font-size:12px; font-weight:700; text-align:center}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:10px 16px; border-radius:12px; border:1px solid transparent;
  font-weight:800; font-size:12.5px; cursor:pointer; transition:.18s;
  background:var(--subtle); color:var(--text);
}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.6; cursor:not-allowed; transform:none}
.btn-primary{background:linear-gradient(135deg,var(--dark),#4a3427); color:#FAF6F0}
html.dark .btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold-2)); color:#1F1611}
.btn-success{background:var(--success); color:#fff}
.btn-info{background:var(--info); color:#fff}
.btn-ghost{background:var(--subtle); border-color:var(--border); color:var(--text)}
.btn-block{width:100%; padding:14px; font-size:14px; margin-top:6px}
.btn-sm{padding:7px 12px; font-size:11.5px; border-radius:10px}

/* ---------- Topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(16px) saturate(150%);
  border-bottom:1px solid var(--border);
  padding:10px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand{display:flex; align-items:center; gap:8px; font-weight:900; font-size:17px; white-space:nowrap}
.brand .logo{font-size:20px}
.branch-pill{
  background:rgba(200,155,94,.16); color:var(--gold);
  padding:4px 11px; border-radius:20px; font-size:11px; font-weight:800;
}
.live{
  display:inline-flex; align-items:center; gap:6px; margin-inline-start:4px;
  font-size:11px; font-weight:800; color:var(--success);
}
.live i{width:8px;height:8px;border-radius:50%;background:currentColor; box-shadow:0 0 0 3px rgba(74,124,89,.15)}
.live.off{color:var(--danger)}
.live.off i{box-shadow:0 0 0 3px rgba(179,58,58,.15)}
.clock{
  margin-inline-start:auto; font-variant-numeric:tabular-nums; font-weight:900;
  font-size:13px; color:var(--muted); letter-spacing:.5px;
}
.actions{display:flex; align-items:center; gap:6px}
.icon-btn{
  width:38px;height:38px;border-radius:11px;border:1px solid var(--border);
  background:var(--subtle); color:var(--text); cursor:pointer; font-size:15px;
  display:grid;place-items:center; transition:.18s; position:relative;
}
.icon-btn:hover{border-color:var(--gold); color:var(--gold)}
.icon-btn.off{color:var(--muted); opacity:.65}
.icon-btn .dot{
  position:absolute; top:6px; inset-inline-end:6px; width:6px;height:6px;border-radius:50%;
  background:var(--danger); border:1.5px solid var(--surface);
}

/* ---------- Audio banner ---------- */
.audio-banner{
  width:100%; border:0; cursor:pointer; text-align:center;
  padding:11px 16px; font-family:inherit; font-size:12.5px; font-weight:800;
  color:#1F1611; background:linear-gradient(135deg,#F1C40F,#E0A100);
  animation:bannerPulse 2.4s ease-in-out infinite;
}
@keyframes bannerPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}

/* ---------- Layout ---------- */
.layout{display:grid; grid-template-columns:232px 1fr; min-height:calc(100vh - 60px)}
.side{
  background:var(--surface); border-inline-start:1px solid var(--border);
  padding:14px 12px; display:flex; flex-direction:column; gap:4px;
  position:sticky; top:60px; height:calc(100vh - 60px);
}
.nav-btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; padding:12px 14px; border-radius:13px; border:1px solid transparent;
  background:transparent; color:var(--text); cursor:pointer;
  font-weight:800; font-size:13px; text-align:start; transition:.18s;
}
.nav-btn:hover{background:var(--subtle)}
.nav-btn.active{
  background:linear-gradient(135deg, rgba(200,155,94,.2), rgba(200,155,94,.08));
  border-color:rgba(200,155,94,.4); color:var(--gold);
}
.nav-badge{
  min-width:22px; height:20px; padding:0 6px; border-radius:7px;
  background:var(--danger); color:#fff; font-size:10.5px; font-weight:900;
  display:none; place-items:center;
}
.side-foot{margin-top:auto; padding:12px 6px; border-top:1px solid var(--border); font-size:11px; color:var(--muted); line-height:1.9}
.side-foot b{color:var(--text); display:block; font-size:12.5px}

.main{padding:20px; width:100%; max-width:1320px; margin:0 auto}
.page{display:none}
.page.active{display:block; animation:fade .25s ease}
@keyframes fade{from{opacity:0; transform:translateY(6px)}to{opacity:1; transform:none}}

/* ---------- Tabs ---------- */
.tabs{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px}
.tab{
  border:1px solid var(--border); background:var(--surface); color:var(--muted);
  padding:9px 15px; border-radius:11px; font-weight:800; font-size:12.5px;
  cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:7px;
}
.tab b{
  background:var(--subtle); color:var(--text); border-radius:6px;
  padding:1px 7px; font-size:11px; min-width:20px; text-align:center;
}
.tab.on{background:var(--dark); color:#FAF6F0; border-color:var(--dark)}
html.dark .tab.on{background:var(--gold); color:#1F1611; border-color:var(--gold)}
.tab.on b{background:rgba(255,255,255,.18); color:inherit}

/* ---------- Orders ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:14px}
.order{
  background:var(--surface); border:1.5px solid var(--border); border-radius:var(--r);
  overflow:hidden; box-shadow:var(--shadow); transition:border-color .25s, box-shadow .25s;
  display:flex; flex-direction:column;
}
.order.is-late{border-color:var(--danger); box-shadow:0 0 0 3px rgba(179,58,58,.1)}
.order-head{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  padding:11px 14px; background:var(--subtle); border-bottom:1px solid var(--border);
}
.order-table{font-size:15px; font-weight:900; display:flex; align-items:center; gap:8px}
.order-table b{font-size:19px; color:var(--gold)}
.tag{
  font-size:10px; font-weight:900; padding:2px 8px; border-radius:6px;
  background:rgba(179,58,58,.12); color:var(--danger);
}
.tag.new{background:rgba(41,128,185,.12); color:var(--info)}
.tag.ready{background:rgba(74,124,89,.12); color:var(--success)}
.order-body{padding:14px; display:flex; flex-direction:column; gap:10px; flex:1}
.items{list-style:none; margin:0; padding:0; display:grid; gap:8px}
.item-line{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; font-size:13px; font-weight:700}
.item-main{display:grid; gap:3px; min-width:0}
.item-main b{font-weight:800}
.bundle{font-size:11px; color:var(--muted); font-weight:700}
.notes{
  font-size:11px; color:var(--danger); background:rgba(179,58,58,.09);
  padding:5px 8px; border-radius:7px; font-weight:700;
}
.qty{color:var(--gold); font-weight:900; white-space:nowrap; font-variant-numeric:tabular-nums}
.order-total{
  display:flex; justify-content:space-between; align-items:baseline;
  padding-top:10px; border-top:1px dashed var(--border); font-size:12px; color:var(--muted); font-weight:700;
}
.order-total b{font-size:17px; color:var(--text)}
.order-foot{display:flex; align-items:center; gap:10px; margin-top:auto; padding-top:10px}
.timer{
  font-variant-numeric:tabular-nums; font-weight:900; font-size:13px;
  color:var(--muted); display:inline-flex; align-items:center; gap:5px;
}
.order.is-late .timer{color:var(--danger)}
.order-foot .btn{margin-inline-start:auto; flex:0 0 auto}

/* ---------- Calls ---------- */
.call{
  background:var(--surface); border:1.5px solid var(--gold); border-radius:var(--r);
  padding:14px 16px; margin-bottom:12px; display:flex; align-items:center; gap:14px;
  box-shadow:0 0 0 4px rgba(200,155,94,.09);
  animation:callIn .3s ease;
}
@keyframes callIn{from{opacity:0; transform:translateY(-6px)}to{opacity:1; transform:none}}
.call-icon{
  width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:rgba(200,155,94,.16); animation:ring 1.6s ease-in-out infinite;
}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-6deg)}80%{transform:rotate(6deg)}}
.call-body{flex:1; min-width:0}
.call-body b{font-size:15px; font-weight:900; display:block}
.call-body span{font-size:11.5px; color:var(--muted); font-weight:700}
.call .btn{flex:0 0 auto}

/* ---------- Stock ---------- */
.stock-head{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px}
.stock-search{
  flex:1; min-width:200px; display:flex; align-items:center; gap:8px;
  background:var(--surface); border:1.5px solid var(--border); border-radius:12px; padding:0 12px; height:42px;
}
.stock-search input{flex:1; border:0; outline:0; background:none; color:var(--text); font-family:inherit; font-size:13px; height:100%}
.stock-count{font-size:11.5px; font-weight:800; color:var(--muted)}
.stock-count b{color:var(--success)}
.stock-list{display:grid; gap:8px}
.stock-item{
  display:flex; align-items:center; gap:12px; padding:10px 12px;
  background:var(--surface); border:1px solid var(--border); border-radius:13px;
}
.stock-item img{width:44px;height:44px;border-radius:10px;object-fit:cover;background:var(--subtle)}
.stock-item .info{flex:1; min-width:0}
.stock-item .info b{display:block; font-size:13px; font-weight:800; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.stock-item .info span{font-size:11px; color:var(--muted); font-weight:700}
.stock-state{font-size:10.5px; font-weight:900; padding:3px 8px; border-radius:6px}
.stock-state.ok{color:var(--success); background:rgba(74,124,89,.12)}
.stock-state.no{color:var(--danger); background:rgba(179,58,58,.12)}
.stock-state.global{color:var(--muted); background:var(--subtle)}

.switch{position:relative; display:inline-block; width:46px; height:26px; flex:0 0 auto}
.switch input{opacity:0; width:0; height:0}
.switch .slider{
  position:absolute; inset:0; background:#cfc4b6; border-radius:34px; transition:.25s; cursor:pointer;
}
.switch .slider:before{
  content:""; position:absolute; width:20px; height:20px; inset-inline-start:3px; top:3px;
  background:#fff; border-radius:50%; transition:.25s; box-shadow:0 1px 3px rgba(0,0,0,.25);
}
.switch input:checked + .slider{background:var(--success)}
.switch input:checked + .slider:before{transform:translateX(-20px)}
html[dir="ltr"] .switch input:checked + .slider:before{transform:translateX(20px)}
.switch input:disabled + .slider{opacity:.45; cursor:not-allowed}

/* ---------- Empty / toasts ---------- */
.empty{text-align:center; padding:56px 20px; color:var(--muted)}
.empty .ic{font-size:46px; display:block; margin-bottom:10px; opacity:.75}
.empty b{display:block; color:var(--text); font-size:14px; margin-bottom:4px}
.empty p{margin:0; font-size:12.5px}

.toasts{position:fixed; bottom:18px; inset-inline-start:50%; transform:translateX(50%); z-index:300; display:grid; gap:8px; width:min(360px,calc(100vw - 32px))}
@media (max-width:520px){.toasts{transform:none; inset-inline:16px; width:auto}}
.toast{
  background:var(--dark); color:var(--bg); padding:12px 16px; border-radius:13px;
  font-size:12.5px; font-weight:800; box-shadow:var(--shadow-lg);
  animation:toastIn .25s ease; display:flex; align-items:center; gap:8px;
}
html.dark .toast{background:var(--gold); color:#1F1611}
.toast.out{animation:toastOut .25s ease forwards}
@keyframes toastIn{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@keyframes toastOut{to{opacity:0; transform:translateY(8px)}}

/* ---------- Responsive ---------- */
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .side{
    position:static; height:auto; flex-direction:row; overflow-x:auto;
    border-inline-start:none; border-bottom:1px solid var(--border); padding:8px 10px;
  }
  .nav-btn{width:auto; white-space:nowrap; padding:9px 13px}
  .side-foot{display:none}
  .main{padding:14px}
  .clock{display:none}
  .topbar{padding:9px 14px}
}
@media (max-width:560px){
  .brand{font-size:15px}
  .branch-pill{font-size:10px; padding:3px 8px}
  .grid{grid-template-columns:1fr}
  .actions{gap:4px}
  .icon-btn{width:35px;height:35px}
  .login-card{padding:26px 20px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>

<!-- Boot -->
<div id="boot" class="boot">
  <div class="boot-mark">☕</div>
  <div class="spinner"></div>
  <p>جاري تحميل لوحة الفرع…</p>
</div>

<!-- Fatal -->
<div id="fatal" class="fatal" hidden>
  <div class="fatal-box">
    <div class="big" id="fatal-icon">⚠️</div>
    <h2 id="fatal-title">حصلت مشكلة</h2>
    <p id="fatal-msg">—</p>
    <button class="btn btn-primary btn-block" onclick="location.reload()">تحديث الصفحة</button>
  </div>
</div>

<!-- Login -->
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" novalidate>
    <div class="login-mark">☕</div>
    <h1>لوحة الفرع</h1>
    <p class="sub">سجّل دخول بحساب مدير الفرع</p>

    <label class="field">
      <span class="lbl">البريد الإلكتروني</span>
      <input id="email" type="email" dir="ltr" autocomplete="username" placeholder="branch@example.com" />
    </label>

    <label class="field">
      <span class="lbl">كلمة المرور</span>
      <span class="pass-wrap">
        <input id="password" type="password" dir="ltr" autocomplete="current-password" placeholder="••••••••" />
        <button type="button" id="toggle-pass" aria-label="إظهار كلمة المرور">👁</button>
      </span>
    </label>

    <p class="form-error" id="login-error" role="alert"></p>
    <button class="btn btn-primary btn-block" id="login-btn" type="submit">دخول</button>
  </form>
</div>

<!-- No permission -->
<div id="noPerm" class="fatal" hidden>
  <div class="fatal-box">
    <div class="big">🚫</div>
    <h2>لا توجد صلاحيات</h2>
    <p>الحساب ده مش مدير فرع أو موقوف. كلّم الإدارة.</p>
    <button class="btn btn-ghost btn-block" onclick="doLogout()">تسجيل الخروج</button>
  </div>
</div>

<!-- App -->
<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo">☕</span> الغرباوي <span class="branch-pill" id="branch-label">—</span></div>
    <div class="live" id="live"><i></i><span>متصل</span></div>
    <div class="clock" id="clock">—</div>
    <div class="actions">
      <button class="icon-btn" id="btn-sound" title="تشغيل/إيقاف التنبيهات الصوتية" aria-label="الصوت">🔊</button>
      <button class="icon-btn" id="btn-notif" title="إشعارات المتصفح" aria-label="الإشعارات">🔔</button>
      <button class="icon-btn" id="btn-theme" title="الوضع الليلي" aria-label="المظهر">🌓</button>
      <button class="icon-btn" id="btn-logout" title="تسجيل الخروج" aria-label="خروج">⏻</button>
    </div>
  </header>

  <button id="audio-banner" class="audio-banner" hidden>
    🔇 التنبيهات الصوتية متوقفة — اضغط هنا لتفعيل الصوت
  </button>

  <div class="layout">
    <aside class="side">
      <button class="nav-btn active" data-page="orders">
        <span>📦 الأوردرات</span><b class="nav-badge" id="badge-orders">0</b>
      </button>
      <button class="nav-btn" data-page="calls">
        <span>🛎️ نداءات الويتر</span><b class="nav-badge" id="badge-calls">0</b>
      </button>
      <button class="nav-btn" data-page="stock"><span>🍽️ المخزون</span></button>

      <div class="side-foot">
        <b id="foot-branch">—</b>
        <span id="foot-user">—</span><br />
        <span id="foot-tables">—</span>
      </div>
    </aside>

    <main class="main">
      <!-- Orders -->
      <section id="page-orders" class="page active">
        <div class="tabs" id="order-tabs">
          <button class="tab on" data-tab="pending">🟡 جديدة <b>0</b></button>
          <button class="tab" data-tab="preparing">🔵 قيد التحضير <b>0</b></button>
          <button class="tab" data-tab="done">🟢 مكتملة <b>0</b></button>
          <button class="tab" data-tab="all">📋 الكل <b>0</b></button>
        </div>
        <div class="grid" id="orders-grid"></div>
      </section>

      <!-- Calls -->
      <section id="page-calls" class="page">
        <div id="calls-list"></div>
      </section>

      <!-- Stock -->
      <section id="page-stock" class="page">
        <div class="stock-head">
          <label class="stock-search">
            🔍 <input id="stock-search" type="search" placeholder="ابحث عن منتج…" />
          </label>
          <div class="stock-count" id="stock-count">—</div>
        </div>
        <div class="stock-list" id="stock-list"></div>
      </section>
    </main>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="firebase-config.js"></script>
<script>
(function () {
  "use strict";

  /* =========================================================
     أدوات مساعدة
     ========================================================= */
  const $ = (id) => document.getElementById(id);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  const esc = (s) =>
    String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );

  const money = (n) => (Math.round(Number(n) || 0)).toLocaleString("en-US") + " ج";
  const pad2 = (n) => String(n).padStart(2, "0");

  function tsOf(obj) {
    const c = obj && obj.createdAt;
    if (!c) return 0;
    if (typeof c.toMillis === "function") return c.toMillis();
    if (typeof c.toDate === "function") return c.toDate().getTime();
    if (typeof c.seconds === "number") return c.seconds * 1000;
    if (typeof c === "number") return c;
    return 0;
  }

  function elapsedText(ts) {
    if (!ts) return "—";
    const total = Math.max(0, Math.floor((Date.now() - ts) / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    return h > 0 ? h + ":" + pad2(m) + ":" + pad2(s) : pad2(m) + ":" + pad2(s);
  }

  const LATE_MS = 15 * 60 * 1000;

  /* =========================================================
     الحالة
     ========================================================= */
  const state = {
    user: null,
    profile: null,
    branch: null,
    orders: [],
    calls: [],
    items: [],
    tab: "pending",
    stockQuery: "",
    soundOn: localStorage.getItem("gh_sound") !== "off",
    unlocked: false,
    ordersPrimed: false,
    callsPrimed: false,
    seenOrders: new Set(),
    seenCalls: new Set(),
    unsubs: [],
    booted: false,
  };

  const BASE_TITLE = "لوحة الفرع — بن الغرباوي";

  /* =========================================================
     الصوت — WebAudio (مش ملفات خارجية) + فتح بقفلة المتصفح
     ========================================================= */
  const Sound = {
    ctx: null,
    ensure() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!this.ctx) {
        try {
          this.ctx = new AC();
        } catch (e) {
          return null;
        }
      }
      if (this.ctx.state === "suspended") this.ctx.resume().catch(function () {});
      return this.ctx;
    },
    running() {
      return !!this.ctx && this.ctx.state === "running";
    },
    tone(freq, at, dur, vol, type) {
      const ctx = this.ctx;
      if (!ctx) return;
      try {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t0 = ctx.currentTime + at;
        osc.type = type || "sine";
        osc.frequency.setValueAtTime(freq, t0);
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + dur + 0.05);
      } catch (e) {
        /* لا تعطّل الواجهة */
      }
    },
    chime(kind) {
      if (!state.soundOn) return;
      const ctx = this.ensure();
      if (!ctx) return;
      if (kind === "order") {
        this.tone(880, 0, 0.18, 0.5);
        this.tone(1175, 0.16, 0.24, 0.45);
        this.tone(880, 0.44, 0.18, 0.5);
        this.tone(1175, 0.6, 0.3, 0.45);
      } else if (kind === "call") {
        this.tone(1046, 0, 0.12, 0.55);
        this.tone(1318, 0.13, 0.12, 0.55);
        this.tone(1568, 0.26, 0.32, 0.5);
        this.tone(1568, 0.62, 0.32, 0.45);
      } else if (kind === "late") {
        this.tone(440, 0, 0.2, 0.32);
        this.tone(415, 0.26, 0.3, 0.28);
      } else {
        this.tone(700, 0, 0.16, 0.4);
        this.tone(950, 0.18, 0.2, 0.35);
      }
    },
  };

  function unlockAudio(playTest) {
    const ctx = Sound.ensure();
    if (!ctx) return;
    const done = function () {
      state.unlocked = Sound.running();
      updateAudioBanner();
      if (playTest && state.unlocked) Sound.chime("test");
    };
    if (ctx.state === "suspended") ctx.resume().then(done).catch(done);
    else done();
  }

  function updateAudioBanner() {
    const banner = $("audio-banner");
    banner.hidden = !(state.soundOn && !state.unlocked);
  }

  function applySoundUI() {
    const btn = $("btn-sound");
    btn.textContent = state.soundOn ? "🔊" : "🔇";
    btn.classList.toggle("off", !state.soundOn);
    btn.title = state.soundOn ? "التنبيهات الصوتية شغالة" : "التنبيهات الصوتية متوقفة";
    updateAudioBanner();
  }

  /* =========================================================
     تنبيهات بصرية
     ========================================================= */
  function toast(msg, icon) {
    const wrap = $("toasts");
    const el = document.createElement("div");
    el.className = "toast";
    el.innerHTML = "<span>" + (icon || "✅") + "</span><span>" + esc(msg) + "</span>";
    wrap.appendChild(el);
    setTimeout(function () {
      el.classList.add("out");
      setTimeout(function () { el.remove(); }, 260);
    }, 4200);
  }

  let flashTimer = null;

  function flashTitle(msg) {
    if (flashTimer) return;
    let on = false;
    flashTimer = setInterval(function () {
      on = !on;
      document.title = on ? msg : BASE_TITLE;
    }, 900);
    setTimeout(stopFlash, 20000);
  }

  function stopFlash() {
    if (flashTimer) clearInterval(flashTimer);
    flashTimer = null;
    document.title = BASE_TITLE;
  }

  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) {
      stopFlash();
      // لو النظام علّق الصوت لما التاب كان في الخلفية
      if (Sound.ctx && Sound.ctx.state === "suspended") {
        Sound.ctx.resume().catch(function () {});
      }
    }
  });

  function desktopNotify(title, body) {
    try {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body, icon: "logo-01.png", tag: "gharbawy" });
      }
    } catch (e) { /* تجاهل */ }
  }

  function vibrate(pattern) {
    try {
      if (navigator.vibrate) navigator.vibrate(pattern);
    } catch (e) { /* تجاهل */ }
  }

  /* =========================================================
     الشاشات
     ========================================================= */
  function hideBoot() {
    state.booted = true;
    $("boot").hidden = true;
  }

  function showFatal(title, msg, icon) {
    hideBoot();
    $("login").hidden = true;
    $("app").hidden = true;
    $("noPerm").hidden = true;
    $("fatal-icon").textContent = icon || "⚠️";
    $("fatal-title").textContent = title || "حصلت مشكلة";
    $("fatal-msg").textContent = msg || "";
    $("fatal").hidden = false;
  }

  function showLogin() {
    hideBoot();
    $("fatal").hidden = true;
    $("noPerm").hidden = true;
    $("app").hidden = true;
    $("login").hidden = false;
    setTimeout(function () { $("email").focus(); }, 50);
  }

  function showApp() {
    hideBoot();
    $("login").hidden = true;
    $("fatal").hidden = true;
    $("noPerm").hidden = true;
    $("app").hidden = false;
  }

  /* =========================================================
     Firebase
     ========================================================= */
  function fbReady() {
    return !!(window.FB && window.FB.db && window.FB.auth);
  }

  function boot() {
    applySoundUI();
    updateClock();
    if (fbReady()) {
      startAuth();
    } else {
      window.addEventListener("fb-ready", startAuth, { once: true });
      setTimeout(function () {
        if (!fbReady() && !state.booted) {
          showFatal(
            "تعذر الاتصال بالسيرفر",
            "ملف firebase-config.js مش اتحمّل. اتأكد من الإنترنت وجرّب تحديث الصفحة.",
            "📡"
          );
        }
      }, 12000);
    }
  }

  async function startAuth() {
    try {
      const { auth, onAuthStateChanged } = window.FB;
      onAuthStateChanged(auth, function (user) {
        if (user) {
          handleUser(user).catch(function (e) {
            console.error(e);
            showFatal("تعذر تحميل بيانات الحساب", String(e && e.message ? e.message : e), "⚠️");
          });
        } else {
          cleanup();
          showLogin();
        }
      });
    } catch (e) {
      console.error(e);
      showFatal("تعذر تشغيل النظام", String(e && e.message ? e.message : e), "⚠️");
    }
  }

  async function handleUser(user) {
    const { db, doc, getDoc } = window.FB;
    state.user = user;

    const userSnap = await getDoc(doc(db, "users", user.uid));
    if (!userSnap.exists()) return showNoPerm();

    const profile = userSnap.data() || {};
    if (profile.active === false) return showNoPerm();

    if (profile.role !== "branch_manager") {
      location.replace("admin.html");
      return;
    }
    if (!profile.branchId) {
      return showFatal("الحساب مش مربوط بفرع", "كلّم الإدارة تربط حسابك بفرع.", "🏢");
    }

    state.profile = profile;

    const branchSnap = await getDoc(doc(db, "branches", profile.branchId));
    if (!branchSnap.exists()) {
      return showFatal("الفرع مش موجود", "بيانات الفرع اتمسحت أو اتغيّرت. كلّم الإدارة.", "🏢");
    }
    state.branch = Object.assign({ id: branchSnap.id }, branchSnap.data());

    paintProfile();
    showApp();
    subscribeAll();
  }

  function showNoPerm() {
    cleanup();
    hideBoot();
    $("login").hidden = true;
    $("app").hidden = true;
    $("fatal").hidden = true;
    $("noPerm").hidden = false;
  }

  function paintProfile() {
    const b = state.branch;
    $("branch-label").textContent = b.nameAr || b.nameEn || "فرع";
    $("foot-branch").textContent = b.nameAr || "—";
    $("foot-user").textContent = state.profile.name || state.user.email || "—";
    const tables = Array.isArray(b.tables) ? b.tables.length : 0;
    $("foot-tables").textContent = tables ? tables + " طربيزة" : "—";
  }

  function unsubscribeAll() {
    state.unsubs.forEach(function (u) {
      try { if (typeof u === "function") u(); } catch (e) { /* تجاهل */ }
    });
    state.unsubs = [];
  }

  function cleanup() {
    unsubscribeAll();
    state.orders = [];
    state.calls = [];
    state.items = [];
    state.ordersPrimed = false;
    state.callsPrimed = false;
    state.seenOrders = new Set();
    state.seenCalls = new Set();
    stopFlash();
  }

  /* =========================================================
     الاشتراكات اللحظية
     ========================================================= */
  function subscribeAll() {
    unsubscribeAll();
    const { db, collection, query, where, onSnapshot, doc } = window.FB;
    const bId = state.branch.id;

    state.ordersPrimed = false;
    state.callsPrimed = false;
    state.seenOrders = new Set();
    state.seenCalls = new Set();

    // 1) الأوردرات
    state.unsubs.push(
      onSnapshot(
        query(collection(db, "orders"), where("branchId", "==", bId)),
        function (snap) {
          state.orders = snap.docs
            .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
            .sort(function (a, b) { return tsOf(b) - tsOf(a); });

          const ids = new Set(state.orders.map(function (o) { return o.id; }));
          if (!state.ordersPrimed) {
            state.ordersPrimed = true;
            state.seenOrders = ids;
          } else {
            const fresh = state.orders.filter(function (o) {
              return !state.seenOrders.has(o.id) && o.status === "pending";
            });
            state.seenOrders = ids;
            if (fresh.length) notifyNewOrders(fresh);
          }

          renderOrders();
          renderBadges();
        },
        function (err) {
          console.error("orders", err);
          toast("مشكلة في تحميل الأوردرات: " + (err.code || err.message), "⚠️");
          setLive(false);
        }
      )
    );

    // 2) نداءات الويتر (بنفلتر محلياً — أضمن ومش محتاج index)
    state.unsubs.push(
      onSnapshot(
        query(collection(db, "waiter_calls"), where("branchId", "==", bId)),
        function (snap) {
          state.calls = snap.docs
            .map(function (d) { return Object.assign({ id: d.id }, d.data()); })
            .filter(function (c) { return c.status !== "done"; })
            .sort(function (a, b) { return tsOf(b) - tsOf(a); });

          const ids = new Set(state.calls.map(function (c) { return c.id; }));
          if (!state.callsPrimed) {
            state.callsPrimed = true;
            state.seenCalls = ids;
          } else {
            const fresh = state.calls.filter(function (c) {
              return !state.seenCalls.has(c.id) && c.status !== "done";
            });
            state.seenCalls = ids;
            if (fresh.length) notifyCalls(fresh);
          }

          renderCalls();
          renderBadges();
        },
        function (err) {
          console.error("calls", err);
          toast("مشكلة في نداءات الويتر: " + (err.code || err.message), "⚠️");
          setLive(false);
        }
      )
    );

    // 3) المنتجات
    state.unsubs.push(
      onSnapshot(
        collection(db, "menu"),
        function (snap) {
          state.items = snap.docs
            .map(function (d) { return Object.assign({ id: Number(d.id) }, d.data()); })
            .sort(function (a, b) { return a.id - b.id; });
          renderStock();
        },
        function (err) {
          console.error("menu", err);
        }
      )
    );

    // 4) الفرع نفسه (تغييرات المخزون من الإدارة)
    state.unsubs.push(
      onSnapshot(
        doc(db, "branches", bId),
        function (snap) {
          if (!snap.exists()) return;
          state.branch = Object.assign({ id: snap.id }, snap.data());
          paintProfile();
          renderStock();
        },
        function (err) {
          console.error("branch", err);
        }
      )
    );
  }

  /* =========================================================
     التنبيهات
     ========================================================= */
  function notifyNewOrders(list) {
    Sound.chime("order");
    vibrate([220, 120, 220]);
    flashTitle("🔔 أوردر جديد");
    if (list.length === 1) {
      toast("أوردر جديد — طربيزة " + (list[0].table || "—"), "🔔");
      desktopNotify("أوردر جديد", "طربيزة " + (list[0].table || "—") + " — " + money(list[0].total));
    } else {
      toast(list.length + " أوردرات جديدة وصلت", "🔔");
      desktopNotify("أوردرات جديدة", list.length + " طلب في انتظار التحضير");
    }
  }

  function notifyCalls(list) {
    Sound.chime("call");
    vibrate([300, 150, 300, 150, 300]);
    flashTitle("🛎️ نداء ويتر");
    const first = list[0];
    toast("نداء ويتر — طربيزة " + (first.table || "—"), "🛎️");
    desktopNotify("نداء ويتر", "طربيزة " + (first.table || "—") + " بيسأل على الويتر");
  }

  /* =========================================================
     الرسم: الأوردرات
     ========================================================= */
  function orderCard(o) {
    const ts = tsOf(o);
    const isLate = ts && Date.now() - ts > LATE_MS && o.status !== "done";
    const items = Array.isArray(o.items) ? o.items : [];

    const itemsHtml = items.map(function (i) {
      const name = esc(i.nameAr || i.nameEn || "صنف");
      const qty = Number(i.qty) || 0;
      let sub = "";
      if (i.isBundle && Array.isArray(i.bundleItems) && i.bundleItems.length) {
        sub = i.bundleItems
          .map(function (b) { return esc(b.nameAr || "") + " ×" + b.qty; })
          .join(" + ");
      }
      return (
        '<li class="item-line">' +
          '<div class="item-main">' +
            "<b>" + name + "</b>" +
            (sub ? '<span class="bundle">🍔 ' + sub + "</span>" : "") +
            (i.notes ? '<span class="notes">📝 ' + esc(i.notes) + "</span>" : "") +
          "</div>" +
          '<span class="qty">×' + qty + "</span>" +
        "</li>"
      );
    }).join("");

    let action = "";
    if (o.status === "pending") {
      action = '<button class="btn btn-info btn-sm" data-action="start" data-id="' + esc(o.id) + '">▶️ بدء التحضير</button>';
    } else if (o.status === "preparing") {
      action = '<button class="btn btn-success btn-sm" data-action="done" data-id="' + esc(o.id) + '">✅ تم التسليم</button>';
    }

    return (
      '<article class="order' + (isLate ? " is-late" : "") + '" data-start="' + ts + '" data-status="' + esc(o.status) + '">' +
        '<div class="order-head">' +
          '<div class="order-table">طربيزة <b>' + esc(o.table || "—") + "</b></div>" +
          (isLate ? '<span class="tag">متأخر</span>' : "") +
        "</div>" +
        '<div class="order-body">' +
          '<ul class="items">' + (itemsHtml || '<li class="item-line">بدون أصناف</li>') + "</ul>" +
          '<div class="order-total"><span>الإجمالي</span><b>' + money(o.total) + "</b></div>" +
          '<div class="order-foot">' +
            '<span class="timer">⏱ <span data-ts="' + ts + '">' + elapsedText(ts) + "</span></span>" +
            action +
          "</div>" +
        "</div>" +
      "</article>"
    );
  }

  function renderOrders() {
    const grid = $("orders-grid");
    let list = state.orders;
    if (state.tab !== "all") list = list.filter(function (o) { return o.status === state.tab; });

    if (!list.length) {
      grid.innerHTML =
        '<div class="empty" style="grid-column:1/-1">' +
          '<span class="ic">📦</span>' +
          "<b>مفيش أوردرات هنا</b>" +
          "<p>كل حاجة تظهر لحظة بلحظة أول ما توصل.</p>" +
        "</div>";
      return;
    }
    grid.innerHTML = list.map(orderCard).join("");
  }

  function renderBadges() {
    const counts = { pending: 0, preparing: 0, done: 0, all: state.orders.length };
    state.orders.forEach(function (o) {
      if (counts[o.status] != null) counts[o.status]++;
    });

    $$("#order-tabs .tab").forEach(function (tab) {
      const key = tab.dataset.tab;
      const b = tab.querySelector("b");
      if (b) b.textContent = counts[key] || 0;
    });

    updateBadge("badge-orders", counts.pending);
    updateBadge("badge-calls", state.calls.length);
  }

  function updateBadge(id, count) {
    const el = $(id);
    if (!el) return;
    el.textContent = count;
    el.style.display = count > 0 ? "inline-grid" : "none";
    el.style.placeItems = "center";
  }

  async function setOrderStatus(id, next) {
    const order = state.orders.find(function (o) { return o.id === id; });
    if (!order) return;
    const prev = order.status;

    order.status = next;
    renderOrders();
    renderBadges();

    try {
      const { db, doc, updateDoc } = window.FB;
      await updateDoc(doc(db, "orders", id), { status: next });
      toast(next === "preparing" ? "بدأ التحضير — العميل هيتنبّه" : "تم التسليم — العميل هيتنبّه", "✅");
    } catch (e) {
      order.status = prev;
      renderOrders();
      renderBadges();
      toast("فشل تحديث الأوردر: " + (e.code || e.message), "❌");
    }
  }

  /* =========================================================
     الرسم: النداءات
     ========================================================= */
  function renderCalls() {
    const list = $("calls-list");
    if (!state.calls.length) {
      list.innerHTML =
        '<div class="empty">' +
          '<span class="ic">🛎️</span>' +
          "<b>مفيش نداءات حالياً</b>" +
          "<p>أول ما عميل يضغط الجرس، هتسمع صوت وهتلاقيه هنا.</p>" +
        "</div>";
      return;
    }

    list.innerHTML = state.calls.map(function (c) {
      const ts = tsOf(c);
      return (
        '<div class="call">' +
          '<div class="call-icon">🛎️</div>' +
          '<div class="call-body">' +
            "<b>طربيزة " + esc(c.table || "—") + "</b>" +
            "<span>منذ <span data-ts=\"" + ts + "\">" + elapsedText(ts) + "</span></span>" +
          "</div>" +
          '<button class="btn btn-success btn-sm" data-call="' + esc(c.id) + '">🏃 تم التلبية</button>' +
        "</div>"
      );
    }).join("");
  }

  async function attendCall(id) {
    const call = state.calls.find(function (c) { return c.id === id; });
    if (!call) return;

    const idx = state.calls.indexOf(call);
    state.calls.splice(idx, 1);
    renderCalls();
    renderBadges();

    try {
      const { db, doc, updateDoc } = window.FB;
      await updateDoc(doc(db, "waiter_calls", id), { status: "done" });
      toast("تم إبلاغ العميل بوصول الويتر", "✅");
    } catch (e) {
      state.calls.splice(idx, 0, call);
      renderCalls();
      renderBadges();
      toast("فشل تحديث النداء: " + (e.code || e.message), "❌");
    }
  }

  /* =========================================================
     الرسم: المخزون
     ========================================================= */
  function branchItems() {
    const menuId = state.branch && state.branch.menuId;
    if (!menuId) return state.items;
    return state.items.filter(function (i) { return i.menuId === menuId; });
  }

  function renderStock() {
    const list = $("stock-list");
    const items = branchItems();
    const overrides = (state.branch && state.branch.stockOverrides) || {};
    const q = state.stockQuery.trim().toLowerCase();

    const filtered = items.filter(function (i) {
      if (!q) return true;
      return ((i.nameAr || "") + " " + (i.nameEn || "")).toLowerCase().indexOf(q) !== -1;
    });

    const available = items.filter(function (i) {
      return i.inStock !== false && overrides[i.id] !== false;
    }).length;

    $("stock-count").innerHTML = "المتاح: <b>" + available + "</b> من " + items.length;

    if (!filtered.length) {
      list.innerHTML =
        '<div class="empty"><span class="ic">🍽️</span><b>مفيش منتجات</b><p>جرّب بحث تاني.</p></div>';
      return;
    }

    list.innerHTML = filtered.map(function (item) {
      const globalOut = item.inStock === false;
      const localOut = overrides[item.id] === false;
      const on = !globalOut && !localOut;

      let stateLabel = '<span class="stock-state ok">متوفر</span>';
      if (globalOut) stateLabel = '<span class="stock-state global">مقفول من الإدارة</span>';
      else if (localOut) stateLabel = '<span class="stock-state no">نفد في الفرع</span>';

      return (
        '<div class="stock-item">' +
          '<img src="' + esc(item.image || "images/hot-coffee/01.jpg") + '" alt="" onerror="this.style.visibility=\'hidden\'" />' +
          '<div class="info">' +
            "<b>" + esc(item.nameAr || "") + "</b>" +
            "<span>" + money(item.price) + "</span>" +
          "</div>" +
          stateLabel +
          '<label class="switch">' +
            '<input type="checkbox" ' + (on ? "checked" : "") + (globalOut ? " disabled" : "") +
            ' data-item="' + item.id + '" />' +
            '<span class="slider"></span>' +
          "</label>" +
        "</div>"
      );
    }).join("");
  }

  async function setStock(itemId, available) {
    if (!state.branch) return;
    const prevOverrides = Object.assign({}, state.branch.stockOverrides || {});
    const overrides = Object.assign({}, prevOverrides);

    if (available) delete overrides[itemId];
    else overrides[itemId] = false;

    state.branch.stockOverrides = overrides;
    renderStock();

    try {
      const { db, doc, updateDoc } = window.FB;
      await updateDoc(doc(db, "branches", state.branch.id), { stockOverrides: overrides });
      toast(available ? "المنتج بقى متاح في الفرع" : "المنتج اتقفل في الفرع", available ? "✅" : "🚫");
    } catch (e) {
      state.branch.stockOverrides = prevOverrides;
      renderStock();
      toast("فشل تحديث المخزون: " + (e.code || e.message), "❌");
    }
  }

  /* =========================================================
     واجهة: تنقل / ساعة / حالة الاتصال
     ========================================================= */
  function showPage(pageId) {
    $$(".page").forEach(function (p) { p.classList.remove("active"); });
    $$(".nav-btn").forEach(function (b) { b.classList.remove("active"); });
    const page = $("page-" + pageId);
    if (page) page.classList.add("active");
    const btn = document.querySelector('.nav-btn[data-page="' + pageId + '"]');
    if (btn) btn.classList.add("active");
  }

  function updateClock() {
    const d = new Date();
    $("clock").textContent =
      d.toLocaleTimeString("ar-EG", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function setLive(on) {
    const el = $("live");
    el.classList.toggle("off", !on);
    el.querySelector("span").textContent = on ? "متصل" : "غير متصل";
  }

  function tick() {
    updateClock();
    $$("[data-ts]").forEach(function (el) {
      const ts = Number(el.dataset.ts);
      if (ts) el.textContent = elapsedText(ts);
    });
    $$(".order[data-start]").forEach(function (card) {
      const ts = Number(card.dataset.start) || 0;
      if (!ts || card.dataset.status === "done") return;
      card.classList.toggle("is-late", Date.now() - ts > LATE_MS);
    });
  }

  /* =========================================================
     الأحداث
     ========================================================= */
  function bindUI() {
    // الصوت
    $("btn-sound").addEventListener("click", function () {
      state.soundOn = !state.soundOn;
      localStorage.setItem("gh_sound", state.soundOn ? "on" : "off");
      applySoundUI();
      if (state.soundOn) unlockAudio(true);
      else toast("التنبيهات الصوتية اتقفلت", "🔇");
    });

    // أول لمسة/ضغطة مفتاح تفتح الصوت (سياسة المتصفح) — بنحاول لحد ما يفتح
    function firstGesture() {
      if (!state.unlocked) unlockAudio(false);
      if (flashTimer) stopFlash();
    }
    document.addEventListener("pointerdown", firstGesture);
    document.addEventListener("keydown", firstGesture);

    $("audio-banner").addEventListener("click", function () {
      unlockAudio(true);
      if (!state.unlocked) {
        toast("المتصفح رافض تشغيل الصوت — جرّب تضغط على الصفحة تاني", "⚠️");
      }
    });

    // إشعارات المتصفح
    $("btn-notif").addEventListener("click", async function () {
      if (!("Notification" in window)) {
        toast("المتصفح مش بيدعم الإشعارات", "⚠️");
        return;
      }
      if (Notification.permission === "granted") {
        toast("إشعارات المتصفح مفعّلة", "🔔");
        return;
      }
      if (Notification.permission === "denied") {
        toast("الإشعارات مرفوضة — فعّلها من إعدادات المتصفح", "⚠️");
        return;
      }
      try {
        const p = await Notification.requestPermission();
        toast(p === "granted" ? "تم تفعيل إشعارات المتصفح" : "الإشعارات مرفوضة", p === "granted" ? "🔔" : "⚠️");
      } catch (e) {
        toast("تعذر طلب الإشعارات", "⚠️");
      }
    });

    // المظهر
    if (localStorage.getItem("gh_theme") === "dark") document.documentElement.classList.add("dark");
    $("btn-theme").addEventListener("click", function () {
      const dark = document.documentElement.classList.toggle("dark");
      localStorage.setItem("gh_theme", dark ? "dark" : "light");
    });

    $("btn-logout").addEventListener("click", doLogout);

    // تنقل
    $$(".nav-btn").forEach(function (btn) {
      btn.addEventListener("click", function () { showPage(btn.dataset.page); });
    });

    // تابات الأوردرات
    $("order-tabs").addEventListener("click", function (e) {
      const tab = e.target.closest(".tab");
      if (!tab) return;
      state.tab = tab.dataset.tab;
      $$("#order-tabs .tab").forEach(function (t) { t.classList.toggle("on", t === tab); });
      renderOrders();
    });

    // أزرار الأوردرات
    $("orders-grid").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      btn.disabled = true;
      const ACTION = { start: "preparing", done: "done" };
      setOrderStatus(btn.dataset.id, ACTION[btn.dataset.action]).finally(function () {
        btn.disabled = false;
      });
    });

    // أزرار النداءات
    $("calls-list").addEventListener("click", function (e) {
      const btn = e.target.closest("[data-call]");
      if (!btn) return;
      btn.disabled = true;
      attendCall(btn.dataset.call).finally(function () { btn.disabled = false; });
    });

    // المخزون
    $("stock-search").addEventListener("input", function (e) {
      state.stockQuery = e.target.value;
      renderStock();
    });

    $("stock-list").addEventListener("change", function (e) {
      const input = e.target.closest("input[data-item]");
      if (!input) return;
      input.disabled = true;
      setStock(Number(input.dataset.item), input.checked).finally(function () {
        input.disabled = false;
      });
    });

    // الشبكة
    window.addEventListener("online", function () { setLive(true); });
    window.addEventListener("offline", function () { setLive(false); });
  }

  async function doLogout() {
    try {
      cleanup();
      const { auth, signOut } = window.FB;
      await signOut(auth);
    } catch (e) {
      console.error(e);
      location.reload();
    }
  }

  async function login(e) {
    e.preventDefault();
    const btn = $("login-btn");
    const err = $("login-error");
    const email = $("email").value.trim();
    const password = $("password").value;

    err.textContent = "";

    if (!email || !password) {
      err.textContent = "اكتب البريد وكلمة المرور";
      return;
    }

    btn.disabled = true;
    btn.textContent = "جاري الدخول…";

    try {
      const { auth, signInWithEmailAndPassword } = window.FB;
      await signInWithEmailAndPassword(auth, email, password);
      $("password").value = "";
    } catch (ex) {
      const code = (ex && ex.code) || "";
      const map = {
        "auth/invalid-email": "صيغة البريد غير صحيحة",
        "auth/user-not-found": "الحساب مش موجود",
        "auth/wrong-password": "كلمة المرور غلط",
        "auth/invalid-credential": "البريد أو كلمة المرور غلط",
        "auth/too-many-requests": "محاولات كتير — جرّب بعد شوية",
        "auth/network-request-failed": "مشكلة في الاتصال بالإنترنت",
      };
      err.textContent = map[code] || "تعذر تسجيل الدخول — جرّب تاني";
    } finally {
      btn.disabled = false;
      btn.textContent = "دخول";
    }
  }

  /* =========================================================
     تشغيل
     ========================================================= */
  document.addEventListener("DOMContentLoaded", function () {
    bindUI();
    boot();

    setInterval(tick, 1000);

    // تذكير متكرر بالنداءات اللي لسه مفتوحة
    setInterval(function () {
      if (!state.soundOn || !Sound.running()) return;
      if (state.calls.length) Sound.chime("call");
    }, 25000);

    // تنبيه هادي للأوردرات المتأخرة
    setInterval(function () {
      if (!state.soundOn || !Sound.running()) return;
      const late = state.orders.some(function (o) {
        return (o.status === "pending" || o.status === "preparing") && Date.now() - tsOf(o) > LATE_MS;
      });
      if (late) Sound.chime("late");
    }, 120000);

    $("login-form").addEventListener("submit", login);

    $("toggle-pass").addEventListener("click", function () {
      const input = $("password");
      const showing = input.type === "text";
      input.type = showing ? "password" : "text";
      $("toggle-pass").textContent = showing ? "👁" : "🙈";
    });
  });

  // متاح للأزرار inline لو احتجنا
  window.doLogout = doLogout;
})();
</script>
</body>
</html>
