<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة إدارة الفرع — بن الغرباوي</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root {
  --bg: #FAF6F0; --surface: #FFFFFF; --subtle: #F5EEE5;
  --text: #1F1611; --muted: #8A7566; --border: #E8DED2;
  --gold: #C89B5E; --dark: #2B1D14; --danger: #B33A3A;
  --success: #4A7C59; --info: #2980b9;
}
* { box-sizing: border-box; }
body { font-family: 'Cairo', system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; }
.topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 30; }
.layout { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 61px); }
.side { background: var(--surface); border-left: 1px solid var(--border); padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
.main { padding: 24px; overflow: auto; max-width: 1400px; width: 100%; margin: 0 auto; }
.waiter-bar { background: linear-gradient(135deg, #2B1D14, #4A3324); color: #FAF6F0; padding: 14px 20px; border-radius: 14px; margin-bottom: 20px; border: 1px solid var(--gold); }
.waiter-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.waiter-chip { background: var(--surface); color: var(--text); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 800; white-space: nowrap; border: 1px solid var(--border); }
.btn { padding: 8px 14px; border-radius: 10px; border: none; font-family: inherit; font-weight: 800; font-size: 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn-primary { background: var(--dark); color: var(--bg); }
.btn-success { background: var(--success); color: #fff; }
.btn-gold { background: var(--gold); color: #1F1611; }
#loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
#loginCard { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 32px; width: 380px; text-align: center; }
input { width: 100%; padding: 11px 14px; margin-bottom: 12px; background: var(--subtle); border: 1.5px solid var(--border); border-radius: 10px; outline: none; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--dark); color: var(--bg); padding: 10px 20px; border-radius: 12px; font-weight: 800; z-index: 200; }
</style>
</head>
<body>

<div id="loginOverlay">
  <div id="loginCard">
    <h2>إدارة الفرع — الغرباوي</h2>
    <input id="email" type="email" placeholder="البريد الإلكتروني" dir="ltr">
    <input id="password" type="password" placeholder="كلمة المرور" dir="ltr">
    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="doLogin()">دخول</button>
  </div>
</div>

<div id="toastContainer"></div>

<div id="app" style="display: none;">
  <header class="topbar">
    <div><strong>☕ الغرباوي</strong> <span id="branchBadge">جاري التحميل...</span></div>
    <button class="btn btn-primary" onclick="doLogout()">خروج</button>
  </header>
  <div class="layout">
    <aside class="side">
      <button class="btn btn-gold">📊 التحليلات والطلبات</button>
    </aside>
    <main class="main">
      <div id="waiterCallsContainer"></div>
      <div style="background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px;">
        <h3>أهلاً بك في لوحة تحكم الفرع ☕</h3>
      </div>
    </main>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
let currentUserData = null, branchData = null;
let waiterCalls = [], unsub = null;
let audioCtx = null;

function unlockAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', unlockAudio, { once: true });

// دالة تشغيل التنبيه الصوتي للويتر
function playSound() {
  try {
    unlockAudio(); if (!audioCtx) return;
    [0, 0.16].forEach(d => {
      let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = 880; gain.gain.setValueAtTime(0.4, audioCtx.currentTime + d);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + d + 0.12);
      osc.start(audioCtx.currentTime + d); osc.stop(audioCtx.currentTime + d + 0.12);
    });
  } catch (e) {}
}

function showToast(msg) {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast'; t.innerText = msg;
  c.appendChild(t); setTimeout(() => t.remove(), 3500);
}

window.addEventListener('fb-ready', () => {
  const { auth, onAuthStateChanged, db, doc, getDoc } = window.FB;
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      const snap = await getDoc(doc(db, 'users', user.uid));
      if (snap.exists() && snap.data().role === 'branch_manager') {
        currentUserData = snap.data();
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        subscribeData();
      }
    }
  });
});

async function doLogin() {
  await window.FB.signInWithEmailAndPassword(window.FB.auth, document.getElementById('email').value.trim(), document.getElementById('password').value);
}
async function doLogout() { await window.FB.signOut(window.FB.auth); location.reload(); }

function subscribeData() {
  const { db, collection, query, where, onSnapshot } = window.FB;
  const bId = currentUserData.branchId;

  const qWaiter = query(collection(db, 'waiter_calls'), where('branchId', '==', bId), where('status', '==', 'pending'));
  let firstLoad = true;
  onSnapshot(qWaiter, (snap) => {
    snap.docChanges().forEach(ch => {
      if (ch.type === 'added' && !firstLoad) {
        playSound(); // تشغيل الصوت فوراً عند ورود نداء جديد
        showToast(`🛎️ طربيزة ${ch.doc.data().table || '—'} تطلب الويتر`);
      }
    });
    firstLoad = false;
    waiterCalls = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderWaiterBar();
  });
}

function renderWaiterBar() {
  const el = document.getElementById('waiterCallsContainer');
  if (!waiterCalls.length) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <div class="waiter-bar">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <strong>🛎️ استدعاءات الويتر المعلقة (${waiterCalls.length})</strong>
      </div>
      <div class="waiter-chips">
        ${waiterCalls.map(c => `
          <div class="waiter-chip">
            <span>طربيزة ${c.table}</span>
            <button class="btn btn-success" onclick="resolveWaiterCall('${c.id}')">✓</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

async function resolveWaiterCall(id) {
  const { db, doc, updateDoc } = window.FB;
  try {
    await updateDoc(doc(db, 'waiter_calls', id), {
      status: 'done',
      responded: true
    });
    showToast('✅ تم تأكيد النداء وإرساله للعميل');
  } catch (e) {
    console.error(e);
  }
}
</script>
</body>
</html>
