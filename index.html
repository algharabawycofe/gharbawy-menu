<!-- ===== إصلاح سعر العروض (gharbawy-offer-fix v1.1) ===== -->
<script>
/*!
 * ============================================================
 *  gharbawy-offer-fix.js  —  v1.0
 *  إصلاح سعر العروض (الكومبو) في منيو الغرباوي
 * ------------------------------------------------------------
 *  المشكلة:
 *    - لما العميل يضغط "اطلب دلوقتي" على عرض في السلايدر،
 *      كان بيتضاف صنف واحد فقط، وبسعر الصنف (أو بسعر العرض
 *      من غير باقي أصناف الكومبو).
 *    - الأوردر كان بيتبعت من غير dateStr، فتقارير الأدمن
 *      والإحصائيات كانت بتطلع فاضية.
 *
 *  الحل:
 *    - العرض بيتضاف كسطر واحد اسمه عنوان العرض، بسعر العرض،
 *      ومعاه كل أصناف الكومبو (bundleItems) زي ما الأدمن متوقع.
 *    - الأوردر بيتبعت بـ dateStr + isBundle + bundleItems،
 *      فالأدمن وشاشة المطبخ يعرضوا الكومبو صح.
 *
 *  التركيب: أضف الملف بعد سكريبت المنيو الأساسي مباشرة
 *            (الخطوات بالتفصيل في README.md)
 * ============================================================
 */
(function () {
  "use strict";

  var W = window;
  if (W.__GHARBAWY_OFFER_FIX__) return;      // منع التحميل المكرر
  W.__GHARBAWY_OFFER_FIX__ = "1.0";

  // هل سكريبت المنيو الأساسي موجود؟ (لازم fix يتحمّل بعده)
  var hadMenuScript = typeof W.heroCta === "function" && typeof W.addToCart === "function";

  /* ---------------- أدوات مساعدة ---------------- */

  function isAr() {
    try { return typeof currentLang === "undefined" || currentLang === "ar"; }
    catch (e) { return true; }
  }

  function t(arText, enText) { return isAr() ? arText : enText; }

  function toast(msg, icon) {
    try {
      if (typeof W.toast === "function") W.toast(msg, icon || "✅");
      else console.log("[offer-fix]", msg);
    } catch (e) { /* لا تعطّل الواجهة */ }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }

  function money(n) {
    var v = Math.round(Number(n) || 0);
    return v.toLocaleString("en-US") + " ج";
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }

  /** تاريخ محلي YYYY-MM-DD (مش UTC) عشان تقارير الأدمن تطابقه */
  function localDateStr(d) {
    d = d || new Date();
    return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate());
  }

  function itemsList() {
    return (typeof allItems !== "undefined" && Array.isArray(allItems)) ? allItems : [];
  }

  function offersList() {
    return (typeof allOffers !== "undefined" && Array.isArray(allOffers)) ? allOffers : [];
  }

  function cartList() {
    return (typeof cart !== "undefined" && Array.isArray(cart)) ? cart : [];
  }

  function findOffer(id) {
    if (!id) return null;
    var list = offersList();
    for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === id) return list[i];
    return null;
  }

  function priceOf(item) {
    try {
      if (typeof getItemPrice === "function") return Number(getItemPrice(item)) || 0;
    } catch (e) { /* fall back */ }
    return Number(item && item.price) || 0;
  }

  function isAvailable(item) {
    try {
      if (typeof isItemAvailable === "function") return !!isItemAvailable(item);
    } catch (e) { /* fall back */ }
    return !!item && item.inStock !== false;
  }

  function nameOf(item) {
    if (!item) return "";
    return isAr() ? (item.nameAr || item.nameEn || "") : (item.nameEn || item.nameAr || "");
  }

  /**
   * أصناف العرض (الكومبو) بشكل موحّد.
   * بيدعم الشكل الجديد {items:[{itemId,qty}]} والشكل القديم {itemId}.
   */
  function offerBundle(offer) {
    if (!offer) return [];
    var raw = (Array.isArray(offer.items) && offer.items.length)
      ? offer.items
      : (offer.itemId ? [{ itemId: offer.itemId, qty: 1 }] : []);

    var all = itemsList();
    var out = [];
    raw.forEach(function (row) {
      var wanted = Number(row && row.itemId);
      if (!wanted) return;
      var item = null;
      for (var i = 0; i < all.length; i++) {
        if (Number(all[i].id) === wanted) { item = all[i]; break; }
      }
      if (item) {
        out.push({ item: item, qty: Math.max(1, Number(row && row.qty) || 1) });
      }
    });
    return out;
  }

  function bundleOriginal(bundle) {
    return bundle.reduce(function (sum, b) {
      return sum + priceOf(b.item) * b.qty;
    }, 0);
  }

  function slides() {
    return (typeof W.__slides !== "undefined" && Array.isArray(W.__slides)) ? W.__slides : [];
  }

  /** نبضة صغيرة على أيقونة السلة بعد الإضافة */
  function pulseBadge() {
    try {
      var b = document.getElementById("cartBadge");
      if (!b) return;
      b.style.transform = "scale(1.4)";
      setTimeout(function () { b.style.transform = "scale(1)"; }, 220);
    } catch (e) { /* تجاهل */ }
  }

  /* ---------------- إضافة عرض للسلة ---------------- */

  /**
   * بيضيف سطر واحد للعرض: الاسم = عنوان العرض، السعر = سعر العرض،
   * ومعاه كل أصناف الكومبو. مفيش دمج مع سطر عادي لنفس الصنف.
   */
  function addOfferLine(offer, qty, note) {
    var bundle = offerBundle(offer);
    if (!bundle.length) {
      toast(t("العرض ده مش متاح حالياً", "This offer is unavailable"), "⚠️");
      return false;
    }

    var missing = bundle.filter(function (b) { return !isAvailable(b.item); });
    if (missing.length) {
      toast(
        t("العرض غير متاح: ", "Unavailable: ") +
          missing.map(function (b) { return nameOf(b.item); }).join("، "),
        "⚠️"
      );
      return false;
    }

    var unitPrice = Number(offer.price) || 0;
    if (unitPrice <= 0) {
      toast(t("سعر العرض غير محدد", "Offer price is missing"), "⚠️");
      return false;
    }

    var qtyFinal = Math.max(1, Number(qty) || 1);
    var noteTxt = String(note || "").trim();
    var list = cartList();

    // دمج فقط مع نفس العرض + نفس الملاحظة
    var existing = null;
    for (var i = 0; i < list.length; i++) {
      var c = list[i];
      if (c && c.isBundle && c.offerId === offer.id && (c.note || "") === noteTxt) {
        existing = c; break;
      }
    }

    if (existing) {
      existing.qty += qtyFinal;
    } else {
      var original = bundleOriginal(bundle);
      list.push({
        id: bundle[0].item.id,               // يخلي شارة العدد تظهر على كارت أول صنف
        offerId: offer.id,
        isBundle: true,
        nameAr: offer.titleAr || (offer.nameAr || nameOf(bundle[0].item)),
        nameEn: offer.titleEn || offer.titleAr || (offer.nameEn || nameOf(bundle[0].item)),
        basePrice: unitPrice,
        unitPrice: unitPrice,
        originalPrice: original,
        qty: qtyFinal,
        note: noteTxt,
        selections: [],
        selKey: "offer:" + offer.id,
        bundleItems: bundle.map(function (b) {
          return {
            id: b.item.id,
            nameAr: b.item.nameAr || b.item.nameEn || "",
            nameEn: b.item.nameEn || b.item.nameAr || "",
            qty: b.qty,
            price: priceOf(b.item)
          };
        })
      });
    }

    if (typeof saveCart === "function") saveCart();
    else if (typeof W.updateCartBadge === "function") W.updateCartBadge();

    toast(t("تمت إضافة العرض للسلة", "Offer added to cart"), "🔥");
    return true;
  }

  /* ---------------- heroCta (زرار السلايدر) ---------------- */

  W.heroCta = function (slideIdx) {
    var slide = slides()[slideIdx];
    if (!slide) return;

    // 1) عرض حقيقي
    if (slide.type === "offer" && slide.offerId) {
      var offer = findOffer(slide.offerId);
      if (offer) {
        var bundle = offerBundle(offer);

        // عرض على صنف واحد وفيه اختيارات: نفتح شيت الصنف بسعر العرض
        if (bundle.length === 1 && (bundle[0].item.options || []).length > 0) {
          if (typeof openItemSheet === "function") {
            openItemSheet(bundle[0].item.id, Number(offer.price), offer.id);
            return;
          }
        }
        if (addOfferLine(offer, 1, "")) pulseBadge();
        return;
      }
    }

    // 2) صنف عادي (أو عرض مش لاقيينه)
    if (!slide.targetItemId) {
      toast(t("العرض متاح من خلال القائمة", "This offer is available in the menu"), "ℹ️");
      return;
    }

    var item = null;
    var all = itemsList();
    for (var i = 0; i < all.length; i++) {
      if (Number(all[i].id) === Number(slide.targetItemId)) { item = all[i]; break; }
    }
    if (!item) {
      toast(t("الصنف غير متاح", "Item not available"), "⚠️");
      return;
    }
    if (!isAvailable(item)) {
      toast(t("هذا الصنف غير متوفر حالياً", "Item is out of stock"), "⚠️");
      return;
    }

    var override = (slide.type === "offer" && Number(slide.price) > 0) ? Number(slide.price) : null;
    var offerId = slide.offerId || null;

    if ((item.options || []).length > 0) {
      if (typeof openItemSheet === "function") openItemSheet(item.id, override, offerId);
      return;
    }
    W.addToCart(item.id, 1, "", [], override, offerId);
    toast(t("تمت الإضافة للسلة", "Added to cart"), "🛒");
    pulseBadge();
  };

  /* ---------------- addToCart ---------------- */

  /**
   * نفس دالة المنيو، بس:
   *  - أي offerId ليه كومبو => سطر عرض واحد بسعر العرض.
   *  - الدمج بيحصل فقط لو نفس السعر، عشان سطر قديم بسعر الصنف
   *    ما ياخدش الكمية الجديدة.
   */
  W.addToCart = function (id, qty, note, selections, priceOverride, offerId) {
    var item = null;
    var all = itemsList();
    for (var i = 0; i < all.length; i++) {
      if (Number(all[i].id) === Number(id)) { item = all[i]; break; }
    }
    if (!item || !isAvailable(item)) return;

    var offer = offerId ? findOffer(offerId) : null;
    if (offer) {
      var bundle = offerBundle(offer);
      // كومبو (أكتر من صنف) => سطر عرض واحد
      if (bundle.length > 1) {
        addOfferLine(offer, Math.max(1, Number(qty) || 1), note);
        return;
      }
    }

    var basePrice = priceOverride != null ? Number(priceOverride) : priceOf(item);
    var extras = (selections || []).reduce(function (s, x) { return s + (Number(x.price) || 0); }, 0);
    var unitPrice = basePrice + extras;
    var selKey = JSON.stringify((selections || []).map(function (s) { return s.choiceId; }).sort());
    var offerKey = offerId || "menu";
    var qtyFinal = Math.max(1, Number(qty) || 1);
    var noteTxt = note || "";
    var list = cartList();

    var existing = null;
    for (var j = 0; j < list.length; j++) {
      var c = list[j];
      if (!c || c.isBundle) continue;
      if (Number(c.id) !== Number(id)) continue;
      if ((c.note || "") !== noteTxt) continue;
      if (c.selKey !== selKey) continue;
      if ((c.offerId || "menu") !== offerKey) continue;
      if (Number(c.unitPrice) !== Number(unitPrice)) continue;   // ← إصلاح السعر القديم
      existing = c; break;
    }

    if (existing) existing.qty += qtyFinal;
    else list.push({
      id: item.id,
      offerId: offerId || null,
      isBundle: false,
      nameAr: nameOf(item),
      nameEn: item.nameEn || item.nameAr || "",
      basePrice: basePrice,
      unitPrice: unitPrice,
      qty: qtyFinal,
      note: noteTxt,
      selections: selections || [],
      selKey: selKey
    });

    if (typeof saveCart === "function") saveCart();
    else if (typeof W.updateCartBadge === "function") W.updateCartBadge();
  };

  /* ---------------- رسم السلة ---------------- */

  W.renderCartBody = function () {
    var body = document.getElementById("cartBody");
    var footer = document.getElementById("cartFooter");
    if (!body || !footer) return;

    var list = cartList();
    if (!list.length) {
      body.innerHTML = '<div class="empty-state"><div class="icon">🛒</div><p>' +
        t("سلة الطلبات فاضية", "Your cart is empty") + "</p></div>";
      footer.innerHTML = "";
      return;
    }

    body.innerHTML = list.map(function (c, idx) {
      var isOffer = !!c.isBundle;
      var sels = (c.selections || []).map(function (s) { return s.choiceNameAr; }).join("، ");
      var bundleTxt = isOffer
        ? (c.bundleItems || []).map(function (b) { return b.nameAr + " ×" + b.qty; }).join(" + ")
        : "";
      var original = isOffer
        ? (Number(c.originalPrice) || 0) || (c.bundleItems || []).reduce(function (s, b) {
            return s + (Number(b.price) || 0) * (Number(b.qty) || 0);
          }, 0)
        : 0;
      var saved = isOffer && original > Number(c.unitPrice) ? original - Number(c.unitPrice) : 0;

      return '' +
        '<div class="cart-row">' +
          '<div class="cart-row-info">' +
            '<div class="cart-row-name">' +
              (isOffer ? '<span style="display:inline-block;background:linear-gradient(135deg,var(--coffee-gold),var(--coffee-gold-light));color:#1F1611;font-size:9px;font-weight:900;padding:2px 7px;border-radius:6px;margin-inline-end:6px;vertical-align:middle;">🔥 ' + t("عرض", "Offer") + "</span>" : "") +
              esc(c.nameAr || "") +
            "</div>" +
            (bundleTxt ? '<div class="cart-row-sels">🍔 ' + esc(bundleTxt) + "</div>" : "") +
            (sels ? '<div class="cart-row-sels">' + esc(sels) + "</div>" : "") +
            (c.note ? '<div class="cart-row-note">📝 ' + esc(c.note) + "</div>" : "") +
            '<div class="cart-row-price">' +
              money(Number(c.unitPrice) * c.qty) +
              (saved > 0 ? ' <s style="color:var(--text-muted);font-weight:600;font-size:10px;">' + money(original * c.qty) + "</s>" : "") +
            "</div>" +
            (saved > 0
              ? '<div style="font-size:9.5px;color:var(--success);font-weight:800;margin-top:2px;">' + t("وفّرت ", "You saved ") + money(saved * c.qty) + "</div>"
              : "") +
          "</div>" +
          '<div class="qty-stepper">' +
            '<button class="qty-btn" onclick="changeCartQty(' + idx + ',-1)">−</button>' +
            '<span class="qty-value">' + c.qty + "</span>" +
            '<button class="qty-btn" onclick="changeCartQty(' + idx + ',1)">+</button>' +
          "</div>" +
        "</div>";
    }).join("");

    var total = list.reduce(function (s, c) { return s + Number(c.unitPrice) * c.qty; }, 0);

    footer.innerHTML = '' +
      '<div class="cart-total-row">' +
        '<span class="cart-total-label">' + t("الإجمالي", "Total") + "</span>" +
        '<span class="cart-total-amount">' + money(total) + "</span>" +
      "</div>" +
      '<button class="btn-primary" onclick="submitOrder()">' +
        t("🛎️ إرسال الطلب وعرض للويتر", "🛎️ Send order & show to waiter") +
      "</button>";
  };

  /* ---------------- إرسال الطلب ---------------- */

  W.submitOrder = function () {
    var list = cartList();
    if (!list.length || W.__orderSubmitting) return Promise.resolve();

    var branch = (typeof currentBranch !== "undefined") ? currentBranch : null;
    if (!branch) return Promise.resolve();

    var FB = W.FB || {};
    if (!FB.db || !FB.collection || !FB.addDoc) {
      toast(t("خدمة الطلبات مش متصلة، جرّب تحديث الصفحة", "Orders service is not ready"), "❌");
      return Promise.resolve();
    }

    var total = list.reduce(function (s, c) { return s + Number(c.unitPrice) * c.qty; }, 0);
    var tableNum = (typeof currentTable !== "undefined" && currentTable) ? currentTable : (isAr() ? "غير محدد" : "N/A");

    var itemsSnapshot = list.map(function (c) {
      var row = {
        id: c.id,
        nameAr: c.nameAr,
        price: Number(c.unitPrice) || 0,
        qty: c.qty,
        note: c.note || "",
        selections: c.selections || [],
        offerId: c.offerId || null
      };
      if (c.isBundle) {
        row.isBundle = true;
        row.bundleItems = (c.bundleItems || []).map(function (b) {
          return { id: b.id, nameAr: b.nameAr, nameEn: b.nameEn || b.nameAr, qty: b.qty, price: b.price };
        });
      }
      return row;
    });

    var now = new Date();
    var orderDoc = {
      branchId: branch.id,
      branchNameAr: branch.nameAr,
      table: tableNum,
      items: itemsSnapshot,
      total: total,
      status: "pending",
      dateStr: localDateStr(now),     // ← عشان تقارير الأدمن والإحصائيات
      createdAt: (typeof FB.serverTimestamp === "function") ? FB.serverTimestamp() : now
    };

    // طلب استلام / درايف ثرو (pickup.js): نضيف بياناته، والطاولة تبقى "استلام" مهما كانت طاولة قديمة متخزنة
    var extra = {};
    try { extra = (typeof W.GH_ORDER_EXTRA === "function" && W.GH_ORDER_EXTRA()) || {}; } catch (e) { extra = {}; }
    var isPickup = extra.type === "pickup";
    if (isPickup) { tableNum = "استلام"; Object.assign(orderDoc, extra, { table: "استلام" }); }

    W.__orderSubmitting = true;

    return Promise.resolve()
      .then(function () { return (window.FB.guestReady || Promise.resolve(null)); })
      .then(function (uid) { orderDoc.guestUid = uid; return FB.addDoc(FB.collection(FB.db, "orders"), orderDoc); })
      .then(function (ref) {
        try {
          if (typeof myOrders !== "undefined" && Array.isArray(myOrders)) {
            if (!isPickup) myOrders.push({ id: ref.id, table: tableNum, at: Date.now() });
            var cutoff = Date.now() - 6 * 3600 * 1000;
            for (var k = myOrders.length - 1; k >= 0; k--) {
              if (!(myOrders[k] && myOrders[k].at > cutoff)) myOrders.splice(k, 1);
            }
            localStorage.setItem("gharbaoui_my_orders", JSON.stringify(myOrders));
          }
        } catch (e) { /* تجاهل */ }

        // تفريغ السلة
        list.length = 0;
        if (typeof saveCart === "function") saveCart();
        if (typeof closeCartModal === "function") closeCartModal();
        if (typeof playBell === "function") playBell();
        if (!isPickup && typeof W.renderWaiterDisplay === "function") W.renderWaiterDisplay(itemsSnapshot, total, tableNum);
        if (typeof W.updateStatusChips === "function") W.updateStatusChips();
        try { W.dispatchEvent(new CustomEvent("gh-order", { detail: { id: ref.id, table: tableNum, items: itemsSnapshot, pickup: isPickup } })); } catch (e) { /* تجاهل */ }

        toast(isPickup ? t("وصل طلبك للفرع ✅ تابع حالته من الشريط تحت", "Order sent to the branch ✅") : t("تم إرسال الطلب بنجاح", "Order sent successfully"), "✅");
        return ref;
      })
      .catch(function (err) {
        console.error("[offer-fix] submitOrder", err);
        toast(t("حدث خطأ أثناء إرسال الطلب", "Error sending order"), "❌");
      })
      .then(function (res) {
        W.__orderSubmitting = false;
        return res;
      });
  };

  /* =========================================================
     واجهة: عرض تفاصيل العرض + زرار إغلاق (X) للشيتات
     ========================================================= */

    var css = [
      ".gh-sheet-x{position:absolute;top:10px;inset-inline-end:12px;z-index:9;width:34px;height:34px;",
      "border-radius:50%;border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.92);color:#1F1611;",
      "font-size:14px;font-weight:900;line-height:1;cursor:pointer;display:grid;place-items:center;",
      "box-shadow:0 2px 10px rgba(0,0,0,.14)}",
      "html.dark .gh-sheet-x{background:#2b2119;color:#FAF6F0;border-color:#3A2A20}",
      ".gh-offer-img{width:100%;aspect-ratio:16/10;border-radius:20px;overflow:hidden;background:var(--bg-subtle,#F5EEE5)}",
      ".gh-offer-img img{width:100%;height:100%;object-fit:cover;display:block}",
      ".gh-offer-title{font-size:21px;font-weight:900;margin:14px 0 4px;letter-spacing:-.3px}",
      ".gh-offer-desc{font-size:13px;color:var(--text-secondary,#6F4E37);line-height:1.8;margin:0 0 14px;font-weight:600}",
      ".gh-offer-label{font-size:11px;font-weight:900;color:var(--text-muted,#A89080);margin:0 0 8px}",
      ".gh-offer-list{display:grid;gap:6px;margin-bottom:14px}",
      ".gh-offer-row{display:flex;align-items:center;justify-content:space-between;gap:10px;",
      "background:var(--bg-subtle,#F5EEE5);padding:9px 12px;border-radius:11px;font-size:13px;font-weight:700}",
      ".gh-offer-row small{color:var(--text-muted,#A89080);font-weight:700;font-size:11px}",
      ".gh-offer-total{display:flex;align-items:baseline;justify-content:space-between;gap:10px;",
      "border-top:1px dashed var(--border,#E8DED2);padding-top:12px;font-size:12.5px;font-weight:800;",
      "color:var(--text-muted,#A89080)}",
      ".gh-offer-total b{font-size:21px;color:var(--coffee-gold,#C89B5E);font-weight:900}",
      ".gh-offer-old{text-decoration:line-through;margin-inline-start:6px;font-size:12px}",
      ".gh-offer-save{font-size:11.5px;font-weight:900;color:var(--success,#4A7C59);margin-top:4px}",
      ".gh-offer-unavailable{font-size:11.5px;color:var(--danger,#B33A3A);font-weight:800;margin-top:6px}",
    ].join("");
    var tag = document.createElement("style");
    tag.id = "gh-offer-ui-style";
    tag.textContent = css;
    document.head.appendChild(tag);
  }

  function injectSheetClose() {
    var map = [
      ["itemSheet", "closeItemSheet"],
    ];

    map.forEach(function (pair) {
      var sheet = document.getElementById(pair[0]);
      if (!sheet || sheet.querySelector(".gh-sheet-x")) return;

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "gh-sheet-x";
      btn.setAttribute("aria-label", t("إغلاق", "Close"));
      btn.textContent = "✕";
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        var fn = W[pair[1]] || (typeof window[pair[1]] === "function" ? window[pair[1]] : null);
        if (typeof fn === "function") fn();
        else if (typeof closeItemSheet === "function" && pair[0] === "itemSheet") closeItemSheet();
        else if (typeof closeRatingModal === "function") closeRatingModal();
      });
      sheet.appendChild(btn);
    });
  }

  /* ---------- شيت تفاصيل العرض ---------- */
  function buildOfferSheet() {
    if (document.getElementById("ghOfferSheet")) return;

    injectUICSS();

    var backdrop = document.createElement("div");
    backdrop.className = "backdrop";
    backdrop.id = "ghOfferBackdrop";
    backdrop.addEventListener("click", closeOfferSheet);

    var sheet = document.createElement("div");
    sheet.className = "sheet";
    sheet.id = "ghOfferSheet";
    sheet.innerHTML =
      '<button type="button" class="gh-sheet-x" id="ghOfferX" aria-label="' + t("إغلاق", "Close") + '">✕</button>' +
      '<div class="sheet-handle"></div>' +
      '<div class="sheet-body" id="ghOfferBody"></div>' +
      '<div class="sheet-footer" id="ghOfferFoot"></div>';

    document.body.appendChild(backdrop);
    document.body.appendChild(sheet);

    document.getElementById("ghOfferX").addEventListener("click", function (e) {
      e.preventDefault();
      closeOfferSheet();
    });
  }

  function closeOfferSheet() {
    var b = document.getElementById("ghOfferBackdrop");
    var s = document.getElementById("ghOfferSheet");
    if (b) b.classList.remove("open");
    if (s) s.classList.remove("open");
  }

  function openOfferSheet(offer, slide) {
    buildOfferSheet();

    var bundle = offerBundle(offer);
    if (!bundle.length) {
      toast(t("العرض ده مش متاح حالياً", "This offer is unavailable"), "⚠️");
      return;
    }

    var body = document.getElementById("ghOfferBody");
    var foot = document.getElementById("ghOfferFoot");
    if (!body || !foot) return;

    var price = Number(offer.price) || 0;
    var original = bundleOriginal(bundle);
    var img = offer.image || (slide && slide.image) || bundle[0].item.image || "";
    var title = isAr()
      ? (offer.titleAr || offer.nameAr || nameOf(bundle[0].item))
      : (offer.titleEn || offer.titleAr || nameOf(bundle[0].item));
    var desc = isAr()
      ? (offer.descAr || "")
      : (offer.descEn || offer.descAr || "");

    var missing = bundle.filter(function (b) { return !isAvailable(b.item); });

    var rows = bundle.map(function (b) {
      return (
        '<div class="gh-offer-row">' +
          '<span>' + esc(nameOf(b.item)) + ' <small>×' + b.qty + "</small></span>" +
          "<span>" + money(priceOf(b.item) * b.qty) + "</span>" +
        "</div>"
      );
    }).join("");

    var saved = original > price ? original - price : 0;

    body.innerHTML =
      (img ? '<div class="gh-offer-img"><img src="' + esc(img) + '" alt="" onerror="this.style.display=\'none\'"></div>' : "") +
      '<h2 class="gh-offer-title">' + esc(title) + "</h2>" +
      (desc ? '<p class="gh-offer-desc">' + esc(desc) + "</p>" : "") +
      '<p class="gh-offer-label">' + t("أصناف العرض", "Offer items") + "</p>" +
      '<div class="gh-offer-list">' + rows + "</div>" +
      '<div class="gh-offer-total"><span>' + t("سعر العرض", "Offer price") +
        (saved > 0 ? '<s class="gh-offer-old">' + money(original) + "</s>" : "") +
      "</span><b>" + money(price) + "</b></div>" +
      (saved > 0 ? '<div class="gh-offer-save">' + t("وفّرت ", "You save ") + money(saved) + "</div>" : "") +
      (missing.length
        ? '<div class="gh-offer-unavailable">' + t("غير متاح: ", "Unavailable: ") +
          missing.map(function (b) { return esc(nameOf(b.item)); }).join("، ") + "</div>"
        : "");

    foot.innerHTML =
      '<button type="button" class="btn-primary" id="ghOfferAdd" ' + (missing.length ? "disabled" : "") + ">" +
        t("أضف للسلة • " + money(price), "Add to cart • " + money(price)) +
      "</button>";

    var addBtn = document.getElementById("ghOfferAdd");
    if (addBtn) {
      addBtn.addEventListener("click", function () {
        if (addOfferLine(offer, 1, "")) {
          pulseBadge();
          closeOfferSheet();
        }
      });
    }

    document.getElementById("ghOfferBackdrop").classList.add("open");
    document.getElementById("ghOfferSheet").classList.add("open");
  }

  function openSlideDetails(idx) {
    var s = slides()[idx];
    if (!s) return;

    if (s.type === "offer" && s.offerId) {
      var offer = findOffer(s.offerId);
      if (offer) {
        openOfferSheet(offer, s);
        return;
      }
    }

    if (s.targetItemId && typeof W.openItemSheet === "function") {
      W.openItemSheet(s.targetItemId, null, null);
      return;
    }

    toast(t("العرض متاح من خلال القائمة", "This offer is available in the menu"), "ℹ️");
  }

  function bindSlideClicks() {
    var wrap = document.getElementById("slidesWrap");
    if (!wrap || wrap.__ghSlideBound) return;
    wrap.__ghSlideBound = true;

    wrap.addEventListener("click", function (e) {
      if (e.target.closest(".hero-cta") || e.target.closest(".hero-dot") || e.target.closest(".hero-arrow")) return;
      var slide = e.target.closest(".hero-slide");
      if (!slide) return;
      var idx = Number(slide.getAttribute("data-idx"));
      if (!isFinite(idx)) return;
      openSlideDetails(idx);
    });
  }

  function bootUI() {
    injectUICSS();
    injectSheetClose();
    buildOfferSheet();
    bindSlideClicks();

    // لو الشيتات اتأخرت في الـ DOM
    setTimeout(function () { injectSheetClose(); bindSlideClicks(); }, 800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", bootUI);
  } else {
    bootUI();
  }

  /* ---------------- فحص سريع ---------------- */
  console.info(
    "[Gharbawy offer-fix] v1.0 loaded",
    hadMenuScript
      ? "✅ اشتغل صح — العروض هتتحسب بسعر العرض"
      : "⚠️ السكريبت اتحمّل قبل سكريبت المنيو! حطّه آخر حاجة قبل </body>"
  );
})();

</script>
<!-- ===== تقييم الأصناف (gharbawy-ratings v1.4) ===== -->
<script>
/*!
 * ============================================================
 *  gharbawy-ratings.js — v1.4
 *  تقييم الأصناف: نجوم لكل صنف بعد التسليم + متوسط التقييم
 *  يظهر على كارت الصنف. (من غير أي قفل موقع)
 * ------------------------------------------------------------
 *  بيتحمّل بعد سكريبت المنيو (مدموج جوه index.html).
 * ============================================================
 */
(function () {
  "use strict";

  var W = window;
  if (W.__GHARBAWY_RATINGS__) return;
  W.__GHARBAWY_RATINGS__ = "1.4";

  /* =========================================================
     أدوات
     ========================================================= */
  function $(id) { return document.getElementById(id); }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]);
    });
  }

  function isAr() {
    try { return typeof currentLang === "undefined" || currentLang === "ar"; } catch (e) { return true; }
  }
  function t(ar, en) { return isAr() ? ar : en; }

  function toast(msg, icon) {
    try {
      if (typeof W.toast === "function") W.toast(msg, icon || "✅");
      else console.log("[ratings]", msg);
    } catch (e) { /* تجاهل */ }
  }

  function deviceId() {
    var k = "gharbaoui_device";
    try {
      var v = localStorage.getItem(k);
      if (v) return v;
      v = (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : "dev-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem(k, v);
      return v;
    } catch (e) {
      return "dev-anon";
    }
  }

  function currentBranchSafe() {
    try { return typeof currentBranch !== "undefined" ? currentBranch : null; } catch (e) { return null; }
  }

  /* =========================================================
     آخر أوردر محفوظ محليًا (عشان العميل يقدر يقيّم في أي وقت)
     ========================================================= */
  var QUEUE_KEY = "gharbaoui_rating_queue";

  function readStoredOrders() {
    try {
      var arr = JSON.parse(localStorage.getItem(QUEUE_KEY) || "[]");
      return Array.isArray(arr) ? arr : [];
    } catch (e) { return []; }
  }

  function saveLastOrder(lines) {
    try {
      var map = {};
      var out = [];

      function add(id, name, qty) {
        var k = String(id);
        if (map[k]) { map[k].qty += qty; return; }
        map[k] = { id: Number(id), nameAr: name || "", qty: qty };
        out.push(map[k]);
      }

      (lines || []).forEach(function (c) {
        if (!c) return;
        var qty = Number(c.qty) || 1;
        if (c.isBundle && Array.isArray(c.bundleItems)) {
          c.bundleItems.forEach(function (b) {
            if (b && b.id != null) add(b.id, b.nameAr, (Number(b.qty) || 1) * qty);
          });
        } else if (c.id != null) {
          add(c.id, c.nameAr, qty);
        }
      });

      if (!out.length) return;

      var arr = readStoredOrders();
      arr.unshift({ at: Date.now(), items: out });
      arr = arr.slice(0, 5);
      localStorage.setItem(QUEUE_KEY, JSON.stringify(arr));

      var b = $("ghRateBtn");
      if (b) b.style.color = "#F1C40F";
    } catch (e) { /* تجاهل */ }
  }

  function injectRateButton() {
    if ($("ghRateBtn")) return;
    var actions = document.querySelector(".header-actions");
    if (!actions) {
      if (!injectRateButton.tries) injectRateButton.tries = 0;
      if (++injectRateButton.tries < 30) setTimeout(injectRateButton, 400);
      return;
    }

    var btn = document.createElement("button");
    btn.className = "icon-btn";
    btn.id = "ghRateBtn";
    btn.type = "button";
    btn.title = t("قيّم طلبك", "Rate your order");
    btn.setAttribute("aria-label", t("قيّم طلبك", "Rate your order"));
    btn.textContent = "⭐";
    if (readStoredOrders().length) btn.style.color = "#F1C40F";

    btn.addEventListener("click", openLastRating);

    var cartBtn = actions.querySelector(".cart-btn");
    actions.insertBefore(btn, cartBtn || null);
  }

  function openLastRating() {
    var list = readStoredOrders();
    if (!list.length) {
      toast(t("اطلب الأول وبعدها تقدر تقيّم", "Order first, then you can rate"), "⭐");
      return;
    }

    var order = list[0];
    var items = (order.items || []).filter(function (i) { return i && i.id != null; });
    if (!items.length) {
      toast(t("مفيش أصناف للتقييم", "No items to rate"), "⚠️");
      return;
    }

    state.rating = { orderId: order.orderId || null, items: items, itemStars: {} };
    try { ratingState = { orderId: order.orderId || null, stars: 0 }; } catch (e) { /* تجاهل */ }

    if (typeof renderRatingStars === "function") renderRatingStars();
    var c = $("ratingComment");
    if (c) c.value = "";
    injectItemRatings(items);

    var bd = $("ratingBackdrop");
    if (bd) bd.classList.add("open");
    var sh = $("ratingSheet");
    if (sh) sh.classList.add("open");
  }

  // نلتقط أصناف الأوردر وقت الإرسال (قبل ما السلة تتفرّغ)
  function wrapSubmitOrder() {
    var prev = W.submitOrder;
    if (typeof prev !== "function") return;

    W.submitOrder = function () {
      var args = arguments;
      var before = 0;
      var snap = [];

      try {
        before = (typeof myOrders !== "undefined" && Array.isArray(myOrders)) ? myOrders.length : 0;
      } catch (e) { /* تجاهل */ }
      try {
        snap = (typeof cart !== "undefined" && Array.isArray(cart)) ? JSON.parse(JSON.stringify(cart)) : [];
      } catch (e) { /* تجاهل */ }

      var res = prev.apply(W, args);
      if (!res || typeof res.then !== "function") return res;

      return res.then(function (out) {
        try {
          var after = (typeof myOrders !== "undefined" && Array.isArray(myOrders)) ? myOrders.length : 0;
          if (after > before) saveLastOrder(snap);
        } catch (e) { /* تجاهل */ }
        return out;
      });
    };
  }

  /* =========================================================
     الحالة
     ========================================================= */
  var state = {
    device: deviceId(),
    branch: null,
    ratings: {},   // itemId -> {sum, count}
    mine: {},      // itemId -> {stars}
    rating: null,  // { orderId, items, itemStars }
    loaded: false,
  };

  /* =========================================================
     CSS
     ========================================================= */
  function injectCSS() {
    if ($("gh-rate-style")) return;
    var css = [
      ".gh-rate{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:900;",
      "color:var(--coffee-gold,#C89B5E);margin-top:2px}",
      ".gh-rate span{color:var(--text-muted,#A89080);font-weight:700}",
      ".gh-rate-sheet{margin:2px 0 14px;border:1px dashed var(--border,#E8DED2);border-radius:14px;",
      "padding:9px 12px;background:var(--bg-subtle,#F5EEE5)}",
      ".gh-rate-line{font-size:12.5px;font-weight:800;color:var(--coffee-gold,#C89B5E)}",
      ".gh-rate-ask{display:flex;align-items:center;gap:2px;margin-top:5px;font-size:11.5px;color:var(--text-muted,#A89080)}",
      ".gh-rate-ask b{font-weight:800;color:var(--text-secondary,#6F4E37);margin-inline-end:6px}",
      ".gh-rate-ask button{background:none;border:0;padding:0 1px;font-size:20px;line-height:1;cursor:pointer;",
      "color:#d8cdbf;transition:transform .12s}",
      ".gh-rate-ask button.on{color:#F1C40F}",
      ".gh-rate-ask button:active{transform:scale(1.15)}",
      ".gh-card-rate{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:6px 0 2px}",
      ".gh-card-avg{font-size:10.5px;font-weight:900;color:var(--coffee-gold,#C89B5E);white-space:nowrap}",
      ".gh-card-avg em{font-style:normal;color:var(--text-muted,#A89080);font-weight:700;font-size:9.5px}",
      ".gh-card-stars{display:inline-flex;gap:1px;direction:ltr}",
      ".gh-card-stars button{background:none;border:0;padding:0 1px;font-size:15px;line-height:1;",
      "cursor:pointer;color:#d8cdbf;transition:transform .12s}",
      ".gh-card-stars button.on{color:#F1C40F}",
      ".gh-card-stars button:active{transform:scale(1.2)}",
      ".gh-item-ratings{margin:18px 0 6px;border-top:1px dashed var(--border,#E8DED2);padding-top:14px}",
      ".gh-ir-title{font-size:12px;font-weight:900;color:var(--text-secondary,#6F4E37);margin-bottom:10px}",
      ".gh-ir-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;",
      "border-bottom:1px solid var(--border,#E8DED2)}",
      ".gh-ir-row:last-child{border-bottom:0}",
      ".gh-ir-name{font-size:12.5px;font-weight:700;color:var(--text-primary,#1F1611);overflow:hidden;",
      "text-overflow:ellipsis;white-space:nowrap}",
      ".gh-ir-stars{display:inline-flex;gap:2px;flex:0 0 auto;direction:ltr}",
      ".gh-ir-stars button{background:none;border:0;padding:0 1px;font-size:19px;line-height:1;cursor:pointer;",
      "color:#d8cdbf;transition:transform .12s}",
      ".gh-ir-stars button.on{color:#F1C40F}",
      ".gh-ir-stars button:active{transform:scale(1.2)}",
      ".gh-ir-empty{font-size:11.5px;color:var(--text-muted,#A89080);text-align:center;padding:6px 0}",
    ].join("");
    var tag = document.createElement("style");
    tag.id = "gh-rate-style";
    tag.textContent = css;
    document.head.appendChild(tag);
  }

  /* =========================================================
     التقييمات
     ========================================================= */
  function ratingsAvg(itemId) {
    var m = state.ratings[String(itemId)];
    if (!m || !m.count) return null;
    return { avg: m.sum / m.count, count: m.count };
  }

  function loadRatings() {
    var FB = W.FB || {};
    var branch = state.branch || currentBranchSafe();
    if (!FB.db || !FB.collection || !FB.query || !FB.where || !FB.getDocs || !branch) return Promise.resolve();

    return FB.getDocs(
      FB.query(FB.collection(FB.db, "item_ratings"), FB.where("branchId", "==", branch.id))
    )
      .then(function (snap) {
        var map = {};
        var mine = {};
        snap.forEach(function (d) {
          var r = d.data() || {};
          var key = String(r.itemId);
          if (!key || key === "undefined") return;
          var stars = Number(r.stars) || 0;
          if (!map[key]) map[key] = { sum: 0, count: 0 };
          map[key].sum += stars;
          map[key].count += 1;
          if (r.deviceId && r.deviceId === state.device) mine[key] = { stars: stars };
        });
        state.ratings = map;
        state.mine = mine;
        state.loaded = true;
        decorate();
      })
      .catch(function (e) {
        console.warn("[ratings] load failed", e);
      });
  }

  function applyMyRating(key, stars) {
    var m = state.ratings[key] || { sum: 0, count: 0 };
    var old = state.mine[key];
    if (old) m.sum += stars - old.stars;
    else { m.sum += stars; m.count += 1; }
    state.ratings[key] = m;
    state.mine[key] = { stars: stars };
  }


  /* ---- نجوم على كارت المنيو: ضغطة واحدة = تقييم ---- */
  function decorateCards() {
    var grid = $("menuGrid");
    if (!grid) return;

    Array.prototype.forEach.call(grid.querySelectorAll(".menu-card"), function (card) {
      if (card.querySelector(".gh-card-rate")) return;

      var m = /openItemSheet\((\d+)/.exec(card.getAttribute("onclick") || "");
      if (!m) return;

      var id = m[1];
      var titleEl = card.querySelector(".card-title");
      var itemName = titleEl ? titleEl.textContent.trim() : "";

      var body = card.querySelector(".card-body");
      if (!body) return;

      var a = ratingsAvg(id);
      var mine = state.mine[id];

      var row = document.createElement("div");
      row.className = "gh-card-rate";
      row.dataset.id = id;

      row.innerHTML =
        '<span class="gh-card-avg">' +
          (a ? "★ " + a.avg.toFixed(1) + " <em>(" + a.count + ")</em>" : "<em>قيّم</em>") +
        "</span>" +
        '<span class="gh-card-stars">' +
          [1, 2, 3, 4, 5].map(function (n) {
            return '<button type="button" data-star="' + n + '" class="' +
              (mine && mine.stars >= n ? "on" : "") + '">★</button>';
          }).join("") +
        "</span>";

      var bottom = body.querySelector(".card-bottom");
      body.insertBefore(row, bottom || null);

      row.addEventListener("click", function (ev) {
        var btn = ev.target.closest("button[data-star]");
        if (!btn) return;
        ev.preventDefault();
        ev.stopPropagation();
        submitItemRating({ id: Number(id), nameAr: itemName }, Number(btn.getAttribute("data-star")));
      });
    });
  }


  // تقييم سريع من صفحة الصنف نفسها (بعد ما يكون عمل أوردر قبل كده)
  function submitItemRating(item, stars) {
    var FB = W.FB || {};
    var branch = state.branch || currentBranchSafe();
    if (!FB.db || !FB.doc || !FB.setDoc) {
      toast(t("خدمة التقييم مش متصلة", "Ratings service is not ready"), "❌");
      return;
    }
    if (!branch) {
      toast(t("جرّب تاني بعد لحظة", "Try again in a moment"), "⚠️");
      return;
    }
    if (!(stars >= 1 && stars <= 5)) return;

    var key = String(item.id);
    var uid = (FB.auth && FB.auth.currentUser) ? FB.auth.currentUser.uid : null;
    if (!uid) { toast(t("جرّب تاني بعد لحظة", "Try again in a moment"), "⚠️"); return; }
    FB.setDoc(FB.doc(FB.db, "item_ratings", uid + "_" + key), {
      itemId: Number(item.id),
      itemName: item.nameAr || item.nameEn || "",
      branchId: branch.id,
      branchNameAr: branch.nameAr || "",
      uid: uid,
      orderId: null,
      stars: stars,
      updatedAt: FB.serverTimestamp ? FB.serverTimestamp() : new Date(),
    })
      .then(function () {
        applyMyRating(key, stars);
        refreshDecos();
        toast(t("شكراً لتقييمك ⭐", "Thanks for rating ⭐"), "⭐");
      })
      .catch(function (e) {
        console.error("[ratings] item rating", e);
        toast(t("تعذر حفظ التقييم — جرّب تاني", "Couldn't save your rating"), "❌");
      });
  }

  function refreshDecos() {
    Array.prototype.forEach.call(document.querySelectorAll(".gh-rate, .gh-card-rate"), function (n) { n.remove(); });
    var s = document.querySelector(".gh-rate-sheet");
    if (s) s.remove();
    decorate();
  }

  function decorateSheet() {
    var body = $("itemBody");
    if (!body) return;
    var price = body.querySelector(".item-base-price");
    if (!price || body.querySelector(".gh-rate-sheet")) return;
    var item = null;
    try { item = typeof itemSheetState !== "undefined" ? itemSheetState.item : null; } catch (e) { item = null; }
    if (!item) return;

    var a = ratingsAvg(item.id);
    var mine = state.mine[String(item.id)];
    var allowed = true;

    var line = a
      ? "★ " + a.avg.toFixed(1) + " · " + a.count + t(" تقييم", " ratings")
      : t("لسه مفيش تقييمات للصنف ده", "No ratings yet");

    var starsRow = allowed
      ? '<div class="gh-rate-ask"><b>' + t("قيّم الصنف:", "Rate:") + "</b>" +
          [1, 2, 3, 4, 5].map(function (n) {
            return '<button type="button" data-rate="' + n + '" class="' +
              (mine && mine.stars >= n ? "on" : "") + '">★</button>';
          }).join("") + "</div>"
      : '<div class="gh-rate-ask" style="font-size:11px">' +
        t("اطلب الأول عشان تقيّم الصنف", "Order first to rate") + "</div>";

    var el = document.createElement("div");
    el.className = "gh-rate-sheet";
    el.innerHTML = '<div class="gh-rate-line">' + line + "</div>" + starsRow;
    price.parentNode.insertBefore(el, price.nextSibling);

    Array.prototype.forEach.call(el.querySelectorAll("button[data-rate]"), function (b) {
      b.addEventListener("click", function () {
        submitItemRating(item, Number(b.getAttribute("data-rate")));
      });
    });
  }

  var decorateTimer = null;
  function decorate() {
    if (decorateTimer) return;
    decorateTimer = setTimeout(function () {
      decorateTimer = null;
      decorateCards();
      decorateSheet();
    }, 60);
  }

  function watchDOM() {
    if (typeof MutationObserver === "undefined") return;
    var obs = new MutationObserver(function () { decorate(); });
    var grid = $("menuGrid");
    if (grid) obs.observe(grid, { childList: true, subtree: true });
    var sheet = $("itemSheet");
    if (sheet) obs.observe(sheet, { childList: true, subtree: true });
  }

  /* =========================================================
     تقييم الأصناف بعد التسليم
     ========================================================= */
  function injectItemRatings(items) {
    var old = $("ghItemRatings");
    if (old) old.remove();

    var starsEl = $("ratingStars");
    if (!starsEl) return;

    var list = (items || []).filter(function (i) { return i && i.id != null; });
    var wrap = document.createElement("div");
    wrap.className = "gh-item-ratings";
    wrap.id = "ghItemRatings";

    if (!list.length) {
      wrap.innerHTML = '<div class="gh-ir-empty">' + t("مفيش أصناف للتقييم", "No items to rate") + "</div>";
      starsEl.parentNode.insertBefore(wrap, starsEl.nextSibling);
      return;
    }

    wrap.innerHTML =
      '<div class="gh-ir-title">⭐ ' + t("قيّم الأصناف", "Rate the items") + "</div>" +
      list.map(function (i) {
        var id = String(i.id);
        var mine = state.mine[id];
        return (
          '<div class="gh-ir-row" data-item="' + id + '">' +
            '<span class="gh-ir-name">' + esc(i.nameAr || i.nameEn || "") + " ×" + (i.qty || 1) + "</span>" +
            '<span class="gh-ir-stars">' +
              [1, 2, 3, 4, 5].map(function (n) {
                return '<button type="button" data-star="' + n + '" class="' +
                  (mine && mine.stars >= n ? "on" : "") + '">★</button>';
              }).join("") +
            "</span>" +
          "</div>"
        );
      }).join("");

    starsEl.parentNode.insertBefore(wrap, starsEl.nextSibling);

    wrap.addEventListener("click", function (e) {
      var btn = e.target.closest("button[data-star]");
      if (!btn) return;
      var row = btn.closest(".gh-ir-row");
      if (!row) return;
      var id = row.getAttribute("data-item");
      var n = Number(btn.getAttribute("data-star")) || 0;
      state.rating = state.rating || { orderId: null, itemStars: {} };
      state.rating.itemStars[id] = n;
      Array.prototype.forEach.call(row.querySelectorAll("button[data-star]"), function (b) {
        b.classList.toggle("on", Number(b.getAttribute("data-star")) <= n);
      });
    });
  }

  function currentOrderItems(orderId) {
    try {
      var o = (typeof watchedOrders !== "undefined" && watchedOrders) ? watchedOrders[orderId] : null;
      if (o && Array.isArray(o.items)) return o.items;
    } catch (e) { /* تجاهل */ }
    return [];
  }

  // بنحل محل النداء الأصلي عشان نضيف تقييم الأصناف
  W.maybeAskRating = function (orderId) {
    try {
      if (typeof ratedOrders !== "undefined" && ratedOrders[orderId]) return;
    } catch (e) { /* تجاهل */ }

    var sheet = $("ratingSheet");
    if (sheet && sheet.classList.contains("open")) return;

    var items = currentOrderItems(orderId).filter(function (i) { return !i.isBundle; });

    state.rating = { orderId: orderId, items: items, itemStars: {} };

    try { ratingState = { orderId: orderId, stars: 0 }; } catch (e) { /* تجاهل */ }

    if (typeof renderRatingStars === "function") renderRatingStars();
    var comment = $("ratingComment");
    if (comment) comment.value = "";
    injectItemRatings(items);

    var bd = $("ratingBackdrop");
    if (bd) bd.classList.add("open");
    if (sheet) sheet.classList.add("open");
  };

  W.submitRating = function () {
    var stars = 0;
    try { stars = (ratingState && Number(ratingState.stars)) || 0; } catch (e) { stars = 0; }
    if (!stars) {
      toast(t("من فضلك اختر تقييم الطلب", "Please rate your order first"), "⚠️");
      return Promise.resolve();
    }

    var FB = W.FB || {};
    if (!FB.db || !FB.collection || !FB.addDoc) {
      toast(t("خدمة التقييم مش متصلة", "Ratings service is not ready"), "❌");
      return Promise.resolve();
    }

    var orderId = null;
    try { orderId = ratingState.orderId; } catch (e) { orderId = null; }

    var branch = state.branch || currentBranchSafe();
    var commentEl = $("ratingComment");
    var comment = commentEl ? String(commentEl.value || "").trim() : "";

    var overall = FB.addDoc(FB.collection(FB.db, "order_feedback"), {
      orderId: orderId,
      branchId: branch ? branch.id : null,
      branchNameAr: branch ? branch.nameAr : "",
      table: (typeof currentTable !== "undefined" ? currentTable : null),
      deviceId: state.device,
      stars: stars,
      comment: comment,
      createdAt: FB.serverTimestamp ? FB.serverTimestamp() : new Date(),
    });

    var jobs = [overall];
    var applied = [];

    var itemStars = (state.rating && state.rating.itemStars) || {};
    var items = (state.rating && state.rating.items) || [];

    if (FB.setDoc && FB.doc) {
      items.forEach(function (it) {
        var key = String(it.id);
        var n = Number(itemStars[key]) || 0;
        if (!n) return;
        var uid2 = (FB.auth && FB.auth.currentUser) ? FB.auth.currentUser.uid : null;
        if (!uid2) return;
        var docId = uid2 + "_" + key;
        jobs.push(
          FB.setDoc(FB.doc(FB.db, "item_ratings", docId), {
            itemId: Number(it.id),
            itemName: it.nameAr || it.nameEn || "",
            branchId: branch ? branch.id : null,
            branchNameAr: branch ? branch.nameAr : "",
            uid: uid2,
            orderId: orderId,
            stars: n,
            updatedAt: FB.serverTimestamp ? FB.serverTimestamp() : new Date(),
          })
        );
        applied.push({ key: key, stars: n });
      });
    }

    return Promise.all(jobs)
      .then(function () {
        applied.forEach(function (x) { applyMyRating(x.key, x.stars); });
        if (orderId) {
          try {
            ratedOrders[orderId] = true;
            localStorage.setItem("gharbaoui_rated_orders", JSON.stringify(ratedOrders));
          } catch (e) { /* تجاهل */ }
        }
        if (typeof closeRatingModal === "function") closeRatingModal();
        toast(t("شكراً لتقييمك ⭐", "Thanks for your rating ⭐"), "⭐");
        decorate();
        loadRatings();
      })
      .catch(function (e) {
        console.error("[ratings] submitRating", e);
        toast(t("حدث خطأ، حاول تاني", "Something went wrong"), "❌");
      });
  };

  /* =========================================================
     التشغيل
     ========================================================= */
  function boot() {
    if (!document.body) return;
    injectCSS();
    injectRateButton();
    wrapSubmitOrder();

    var tries = 0;
    var timer = setInterval(function () {
      var b = currentBranchSafe();
      if (b && b.id) {
        clearInterval(timer);
        state.branch = b;
        loadRatings();
        watchDOM();
        decorate();
        return;
      }
      if (++tries > 80) {
        clearInterval(timer);
        console.warn("[ratings] branch not available yet");
      }
    }, 250);
  }

  // أدوات للاختبار/التشخيص
  W.__GhRatings = {
    version: "1.4",
    device: state.device,
    avg: ratingsAvg,
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>

<script src="retain.js"></script>
