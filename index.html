<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="theme-color" content="#2B1D14">
<title id="pageTitle">Al-Gharbawy - Digital Menu</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="logo-01.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root { --bg-primary: #FAF6F0; --bg-surface: #FFFFFF; --bg-subtle: #F5EEE5; --text-primary: #1F1611; --text-secondary: #6F4E37; --text-muted: #A89080; --border: #E8DED2; --border-strong: #D4C4B0; --coffee-dark: #2B1D14; --coffee-medium: #6F4E37; --coffee-gold: #C89B5E; --coffee-gold-light: #E0BE85; --danger: #B33A3A; --success: #4A7C59; --shadow-sm: 0 1px 3px rgba(43,29,20,0.06); --shadow-md: 0 4px 16px rgba(43,29,20,0.08); --shadow-lg: 0 12px 40px rgba(43,29,20,0.12); }
html.dark { --bg-primary: #1A1310; --bg-surface: #241B16; --bg-subtle: #1F1712; --text-primary: #FAF6F0; --text-secondary: #D4A56A; --text-muted: #8A7566; --border: #3A2A20; --border-strong: #4A3628; --coffee-dark: #FAF6F0; --coffee-medium: #C89B5E; --coffee-gold: #D4A56A; --coffee-gold-light: #E0BE85; }
* { box-sizing: border-box; transition: background-color 0.25s, border-color 0.25s, color 0.25s; }
body { font-family: 'Cairo', system-ui, sans-serif; background: var(--bg-primary); color: var(--text-primary); margin: 0; min-height: 100vh; }
@media (max-width: 768px) { body { padding-bottom: 90px; } }
.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
.app-header { background: color-mix(in srgb, var(--bg-surface) 92%, transparent); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.icon-btn { width: 38px; height: 38px; border-radius: 12px; background: var(--bg-subtle); border: 1.5px solid var(--border); color: var(--text-primary); display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer; font-family: inherit; } .icon-btn:hover { background: var(--coffee-gold); color: #FFF; border-color: var(--coffee-gold); }
.cart-btn-header { background: linear-gradient(135deg, var(--coffee-dark), var(--coffee-medium)); color: #FFF; padding: 0 14px; height: 38px; border-radius: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 800; cursor: pointer; position: relative; border: none; font-family: inherit; }
.cart-badge { position: absolute; top: -6px; inset-inline-end: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--coffee-gold); color: #1F1611; font-size: 10px; font-weight: 900; display: flex; align-items: center; justify-content: center; border: 2px solid var(--bg-surface); }
.app-main { max-width: 860px; margin: 0 auto; padding: 1rem; width: 100%; }
.search-wrap { position: relative; flex: 1; } .search-input { width: 100%; padding: 12px 16px 12px 42px; background: var(--bg-surface); border: 1.5px solid var(--border); border-radius: 16px; font-size: 13px; color: var(--text-primary); outline: none; font-family: inherit; } html[dir="rtl"] .search-input { padding: 12px 42px 12px 16px; } .search-input:focus { border-color: var(--coffee-gold); } .search-icon { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 14px; color: var(--text-muted); pointer-events: none; }
.cat-tab { padding: 8px 14px; border-radius: 12px; font-size: 12px; font-weight: 800; white-space: nowrap; cursor: pointer; border: 1.5px solid var(--border); background: var(--bg-surface); color: var(--text-secondary); font-family: inherit; display: inline-flex; align-items: center; gap: 6px; } .cat-tab .cat-count { font-size: 10px; padding: 1px 6px; border-radius: 6px; background: color-mix(in srgb, var(--coffee-gold) 15%, transparent); color: var(--coffee-gold); font-weight: 900; } .cat-tab.active { background: var(--coffee-dark); color: var(--bg-primary); border-color: var(--coffee-dark); }
.menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; } @media (min-width: 700px) { .menu-grid { grid-template-columns: 1fr 1fr 1fr; gap: 14px; } }
.menu-card { background: var(--bg-surface); border-radius: 20px; border: 1.5px solid var(--border); overflow: hidden; position: relative; display: flex; flex-direction: column; } .menu-card:hover { border-color: var(--coffee-gold); box-shadow: var(--shadow-md); } .menu-card.out-of-stock { opacity: 0.55; }
.menu-card-img-wrap { position: relative; width: 100%; aspect-ratio: 1 / 1; background: var(--bg-subtle); overflow: hidden; } .menu-card-img { width: 100%; height: 100%; object-fit: cover; }
.menu-card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; flex: 1; min-width: 0; }
.menu-card-title { font-size: 13px; font-weight: 900; color: var(--text-primary); margin: 0; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.7em; }
.menu-card-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; gap: 6px; }
.menu-card-price { font-size: 14px; font-weight: 900; color: var(--coffee-gold); white-space: nowrap; }
.add-btn { padding: 6px 10px; border-radius: 10px; font-size: 11px; font-weight: 900; border: none; cursor: pointer; display: flex; align-items: center; gap: 3px; font-family: inherit; background: linear-gradient(135deg, var(--coffee-gold), var(--coffee-gold-light)); color: #1F1611; }

.sheet-backdrop { position: fixed; inset: 0; background: rgba(26,19,16,0.7); z-index: 60; opacity: 0; pointer-events: none; backdrop-filter: blur(6px); } .sheet-backdrop.open { opacity: 1; pointer-events: auto; } .bottom-sheet { position: fixed; inset-inline: 0; bottom: 0; max-height: 90vh; background: var(--bg-surface); border-radius: 28px 28px 0 0; z-index: 61; transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.32, 0.72, 0, 1); display: flex; flex-direction: column; overflow: hidden; } .bottom-sheet.open { transform: translateY(0); } .sheet-handle { width: 40px; height: 4px; background: var(--border-strong); border-radius: 2px; margin: 10px auto 0; } .sheet-scroll { overflow-y: auto; flex: 1; } .sheet-footer { background: var(--bg-surface); border-top: 1px solid var(--border); padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; }
.primary-btn { padding: 14px 20px; border-radius: 14px; border: none; background: linear-gradient(135deg, var(--coffee-dark), var(--coffee-medium)); color: #FFF; font-size: 13px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; }
.toast-container { position: fixed; top: 80px; inset-inline-end: 16px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; } .toast { background: var(--coffee-dark); color: var(--bg-primary); padding: 12px 16px; border-radius: 14px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 10px; pointer-events: auto; max-width: 300px; box-shadow: var(--shadow-lg); }

.welcome-screen { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 8%, rgba(200,155,94,.12), transparent 26%), linear-gradient(180deg, #FBF7F1 0%, #F4EDE3 100%); } .welcome-screen.is-hidden { opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .65s, visibility .65s; } .welcome-card { width: min(92vw, 560px); padding: 18px 26px 22px; text-align: center; }
.welcome-logo-wrap { width: 154px; height: 154px; margin: 0 auto 24px; border-radius: 50%; display: grid; place-items: center; position: relative; } .welcome-logo-wrap img { width: 116px; height: 116px; object-fit: contain; position: relative; z-index: 2; }
.welcome-title { margin: 0; color: #2B1D14; font-size: clamp(34px, 8vw, 52px); font-weight: 900; } .welcome-subtitle { margin: 14px auto 0; max-width: 420px; color: #6F4E37; font-size: 14px; line-height: 2; font-weight: 600; } .welcome-enter-btn { min-width: 230px; padding: 14px 28px; border-radius: 14px; color: #FFFDF9; background: #2B1D14; font-size: 14px; font-weight: 900; border: none; cursor: pointer; font-family: inherit; box-shadow: 0 8px 20px rgba(43,29,20,.15); }

.branch-select-screen { position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center; background: var(--bg-primary); padding: 20px; } .branch-select-screen.show { display: flex; } .branch-select-card { width: min(92vw, 480px); background: var(--bg-surface); border: 1px solid var(--border); border-radius: 24px; padding: 28px; text-align: center; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-lg); } .branch-option { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--bg-subtle); border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 10px; cursor: pointer; font-family: inherit; width: 100%; text-align: inherit; color: var(--text-primary); }

/* زر استدعاء الويتر (الجرس) العائم */
#callWaiterBtn { display: none; position: fixed; bottom: 30px; inset-inline-start: 20px; z-index: 100; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #C89B5E, #E0BE85); color: #fff; border: none; box-shadow: 0 8px 20px rgba(200,155,94,0.4); font-size: 24px; cursor: pointer; align-items: center; justify-content: center; }
#callWaiterBtn.pending { animation: pulseBtn 1.5s infinite; opacity: 0.7; pointer-events: none; }
@keyframes pulseBtn { 0% { transform: scale(1); } 50% { transform: scale(1.1); box-shadow: 0 0 15px rgba(200,155,94,0.8); } 100% { transform: scale(1); } }
</style>
</head>
<body>

<!-- زر الجرس لاستدعاء الويتر -->
<button id="callWaiterBtn" onclick="callWaiter()" title="استدعاء الويتر">🛎️</button>

<!-- شاشة اختيار الفرع -->
<div id="branchSelectScreen" class="branch-select-screen">
  <div class="branch-select-card">
    <div style="font-size: 48px; margin-bottom: 8px;">☕</div>
    <h2 id="branchSelectTitle">اختار الفرع</h2>
    <p id="branchSelectSub" style="color: var(--text-muted); font-size: 13px;">اختار الفرع اللي إنت فيه عشان تشوف المنيو الصحيح</p>
    <div id="branchList" style="margin-top: 16px;"></div>
  </div>
</div>

<!-- شاشة الترحيب -->
<div id="welcomeScreen" class="welcome-screen">
  <div class="welcome-card">
    <div class="welcome-logo-wrap"><img id="welcomeLogo" src="logo-01.png" alt="Al-Gharbawy" onerror="this.style.display='none';"></div>
    <h1 class="welcome-title" id="welcomeTitle">أهلاً وسهلاً بيك</h1>
    <p class="welcome-subtitle" id="welcomeSubtitle">منور الغرباوي ☕<br>اتفضل خد وقتك، شوف اللي نفسك فيه واختار براحتك.</p>
    <div style="margin-top: 24px;"><button type="button" class="welcome-enter-btn" id="welcomeEnterBtn" onclick="enterWelcome()">تفضل على القائمة</button></div>
  </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<header class="app-header">
  <div style="max-width: 860px; margin: 0 auto; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px;">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
      <div style="width: 42px; height: 42px;"><img id="headerLogo" src="logo-01.png" alt="Al-Gharbawy" style="width: 100%; height: 100%; object-fit: contain;" onerror="this.style.display='none';"></div>
      <div><h1 id="brandTitle" style="font-size: 14px; font-weight: 900; margin: 0;">Al-Gharbawy</h1><p id="brandSub" style="font-size: 10px; color: var(--text-muted); margin: 2px 0 0;">Digital Menu</p></div>
    </div>
    <div style="display: flex; align-items: center; gap: 6px;">
      <button onclick="openCartModal()" class="cart-btn-header">🛒 <span id="cartCountBadge" class="cart-badge" style="display: none;">0</span></button>
      <button onclick="document.documentElement.classList.toggle('dark')" class="icon-btn" title="تبديل المظهر">🌙</button>
      <button onclick="toggleLanguage()" class="icon-btn"><span id="langBtnText" style="font-size: 12px; font-weight: 900;">EN</span></button>
    </div>
  </div>
</header>

<main class="app-main">
  <div style="position: sticky; top: 62px; background: var(--bg-primary); padding: 12px 0; z-index: 40;">
    <div style="display: flex; gap: 8px; margin-bottom: 10px;">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" oninput="filterMenu()" placeholder="ابحث في القائمة..." class="search-input">
      </div>
    </div>
    <div id="categoryTabs" class="no-scrollbar" style="display: flex; overflow-x: auto; gap: 8px; padding-bottom: 4px;"></div>
  </div>
  <div id="customerMenuGrid" class="menu-grid"></div>
</main>

<div id="cartBackdrop" class="sheet-backdrop" onclick="closeCartModal()"></div>
<div id="cartSheet" class="bottom-sheet">
  <div class="sheet-handle"></div>
  <div style="padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
    <h2 id="cartModalTitle" style="font-size: 15px; font-weight: 900; margin: 0;">📋 طلباتي الحالية</h2>
    <button onclick="closeCartModal()" class="icon-btn" style="width: 32px; height: 32px;">✕</button>
  </div>
  <div class="sheet-scroll" style="padding: 16px 20px;"><div id="cartItemsContainer" style="display: flex; flex-direction: column; gap: 12px;"></div></div>
  <div class="sheet-footer" id="cartFooter"></div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
let currentLang = localStorage.getItem('gharbaoui_lang') || 'ar';
let cart = JSON.parse(localStorage.getItem('gharbaoui_cart')) || [];
let activeCategory = 'all', allCategories = [], allItems = [], allBranches = [];
let currentBranch = null, currentMenuId = null, currentTable = null;
let activeWaiterCallId = null;
let audioCtx = null;

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
document.addEventListener('click', initAudio, { once: true });
document.addEventListener('touchstart', initAudio, { once: true });

// صوت رنين الجرس العالي والتنبيه
function playClientBellSound() {
  try {
    initAudio(); if (!audioCtx) return;
    [0, 0.2].forEach(delay => {
      let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, audioCtx.currentTime + delay);
      osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + delay + 0.15);
      gain.gain.setValueAtTime(0.8, audioCtx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + 0.35);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + delay);
      osc.stop(audioCtx.currentTime + delay + 0.35);
    });
  } catch(e) {}
}

function onFbReady(cb) { if (window.FB_READY) cb(); else window.addEventListener('fb-ready', cb, { once: true }); }

function showToast(msg, icon = '✅') {
  const c = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span style="font-size:16px">${icon}</span><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

window.addEventListener('DOMContentLoaded', () => {
  readTableFromUrl();
  applyLanguage();
  updateCartBadge();
  onFbReady(() => { subscribeAll(); });
});

function toggleLanguage() {
  currentLang = currentLang === 'ar' ? 'en' : 'ar';
  localStorage.setItem('gharbaoui_lang', currentLang);
  applyLanguage();
  renderCustomerMenu();
}

function applyLanguage() {
  const root = document.getElementById('htmlRoot');
  root.setAttribute('lang', currentLang);
  root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
  document.getElementById('langBtnText').innerText = currentLang === 'ar' ? 'EN' : 'AR';
  
  if (currentLang === 'en') {
    document.getElementById('welcomeTitle').innerText = 'Welcome';
    document.getElementById('welcomeSubtitle').innerHTML = 'Welcome to Al-Gharbawy ☕<br>Take your time and explore our menu.';
    document.getElementById('welcomeEnterBtn').innerText = 'Explore Menu';
    document.getElementById('branchSelectTitle').innerText = 'Select Branch';
    document.getElementById('branchSelectSub').innerText = 'Choose your current branch to view the correct menu';
    document.getElementById('searchInput').placeholder = 'Search menu...';
    document.getElementById('cartModalTitle').innerText = '📋 Current Orders';
  } else {
    document.getElementById('welcomeTitle').innerText = 'أهلاً وسهلاً بيك';
    document.getElementById('welcomeSubtitle').innerHTML = 'منور الغرباوي ☕<br>اتفضل خد وقتك، شوف اللي نفسك فيه واختار براحتك.';
    document.getElementById('welcomeEnterBtn').innerText = 'تفضل على القائمة';
    document.getElementById('branchSelectTitle').innerText = 'اختار الفرع';
    document.getElementById('branchSelectSub').innerText = 'اختار الفرع اللي إنت فيه عشان تشوف المنيو الصحيح';
    document.getElementById('searchInput').placeholder = 'ابحث في القائمة...';
    document.getElementById('cartModalTitle').innerText = '📋 طلباتي الحالية';
  }
}

function readTableFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const t = params.get('table');
  if (t) { currentTable = t; localStorage.setItem('gharbaoui_table', t); }
  else { currentTable = localStorage.getItem('gharbaoui_table') || null; }
}

function subscribeAll() {
  const { db, collection, onSnapshot, query, where, doc } = window.FB;
  
  // التحقق من تفعيل زر استدعاء الويتر من الإعدادات
  onSnapshot(doc(db, 'settings', 'features'), (snap) => {
    if (snap.exists() && snap.data().callWaiter) { 
      document.getElementById('callWaiterBtn').style.display = 'flex'; 
    } else { 
      document.getElementById('callWaiterBtn').style.display = 'none'; 
    }
  });

  onSnapshot(collection(db, 'branches'), (snap) => {
    allBranches = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(b => b.active !== false);
    checkBranchFromUrl();
  });
  onSnapshot(collection(db, 'menu'), (snap) => {
    allItems = snap.docs.map(d => ({ ...d.data(), id: Number(d.id) }));
    renderCustomerMenu();
  });
  onSnapshot(collection(db, 'categories'), (snap) => {
    allCategories = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderCustomerMenu();
  });

  // الاستماع لحالة أوردرات الطربيزة لتنبيه العميل عند اكتمال التحضير
  if (currentTable) {
    onSnapshot(query(collection(db, 'orders'), where('table', '==', currentTable)), (snap) => {
      snap.docChanges().forEach(ch => {
        if (ch.type === 'modified') {
          const data = ch.doc.data();
          if (data.status === 'done') {
            playClientBellSound();
            showToast(currentLang === 'ar' ? `🎉 أوردر طربيزة ${currentTable} جاهز وفي طريقه إليك بالهناء والشفاء!` : `🎉 Your order for table ${currentTable} is ready and on the way!`, '☕');
          } else if (data.status === 'preparing') {
            showToast(currentLang === 'ar' ? `👨‍🍳 جاري تحضير طلبك الآن في الفرع...` : `👨‍🍳 Your order is being prepared...`, '🔥');
          }
        }
      });
    });
  }
}

function checkBranchFromUrl() {
  if (!allBranches.length) return;
  const params = new URLSearchParams(window.location.search);
  const code = params.get('branch');
  if (code) { const b = allBranches.find(x => x.code === code); if (b) { selectBranch(b); return; } }
  showBranchSelector();
}

function showBranchSelector() {
  document.getElementById('branchSelectScreen').classList.add('show');
  document.getElementById('branchList').innerHTML = allBranches.map(b => `<button class="branch-option" onclick="selectBranchById('${b.id}')"><strong>${currentLang === 'ar' ? b.nameAr : (b.nameEn || b.nameAr)}</strong><small>${b.code}</small></button>`).join('');
}
function selectBranchById(id) { selectBranch(allBranches.find(x => x.id === id)); }
function selectBranch(branch) {
  currentBranch = branch; currentMenuId = branch.menuId;
  document.getElementById('branchSelectScreen').classList.remove('show');
  renderCustomerMenu();
}

function getBranchItems() { if (!currentMenuId) return []; return allItems.filter(i => i.menuId === currentMenuId); }
function getBranchCategories() { if (!currentMenuId) return []; return allCategories.filter(c => c.menuId === currentMenuId && c.active !== false); }
function getItemPrice(item) { if (!currentBranch) return item.price; const overrides = currentBranch.priceOverrides || {}; return overrides[currentBranch.id] ? Number(overrides[currentBranch.id]) : Number(item.price); }

function renderCustomerMenu() {
  if (!currentBranch) return;
  const cats = getBranchCategories(); const items = getBranchItems();
  const allText = currentLang === 'ar' ? 'الكل' : 'All';
  document.getElementById('categoryTabs').innerHTML = `<button onclick="filterCategory('all')" class="cat-tab ${activeCategory === 'all' ? 'active' : ''}">${allText} <span class="cat-count">${items.length}</span></button>` +
    cats.map(c => `<button onclick="filterCategory('${c.id}')" class="cat-tab ${activeCategory === c.id ? 'active' : ''}">${currentLang === 'ar' ? c.nameAr : (c.nameEn || c.nameAr)} <span class="cat-count">${items.filter(i => i.categoryId === c.id).length}</span></button>`).join('');
  filterMenu();
}

function filterCategory(catId) { activeCategory = catId; renderCustomerMenu(); }

function filterMenu() {
  if (!currentBranch) return;
  const searchVal = (document.getElementById('searchInput').value || '').toLowerCase().trim();
  const items = getBranchItems();
  const filtered = items.filter(item => {
    const matchesCategory = (activeCategory === 'all' || item.categoryId === activeCategory);
    const nAr = (item.nameAr || '').toLowerCase();
    const nEn = (item.nameEn || '').toLowerCase();
    return matchesCategory && (nAr.includes(searchVal) || nEn.includes(searchVal));
  });

  document.getElementById('customerMenuGrid').innerHTML = filtered.map(item => {
    const isBranchOutOfStock = currentBranch?.stockOverrides?.[item.id] === false;
    const inStock = isBranchOutOfStock ? false : (item.inStock !== false);
    const itemName = currentLang === 'ar' ? item.nameAr : (item.nameEn || item.nameAr);
    const addText = currentLang === 'ar' ? '+ إضافة' : '+ Add';
    const outText = currentLang === 'ar' ? 'نفد' : 'Sold out';
    return `<div class="menu-card ${inStock ? '' : 'out-of-stock'}">
      <div class="menu-card-img-wrap"><img src="${item.image}" class="menu-card-img" loading="lazy" onerror="this.src='' "></div>
      <div class="menu-card-body">
        <h3 class="menu-card-title">${itemName}</h3>
        <div class="menu-card-bottom">
          <span class="menu-card-price">${getItemPrice(item)} ج</span>
          ${inStock ? `<button class="add-btn" onclick="addToCart(${item.id})">${addText}</button>` : `<span style="font-size:11px;color:var(--danger);font-weight:900;">${outText}</span>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

// دالة زر استدعاء الويتر (الجرس)
async function callWaiter() {
  if (!currentBranch) return;
  const { db, collection, addDoc, onSnapshot, doc } = window.FB;
  const btn = document.getElementById('callWaiterBtn');
  
  playClientBellSound();

  try {
    const docRef = await addDoc(collection(db, 'waiter_calls'), {
      branchId: currentBranch.id,
      branchNameAr: currentBranch.nameAr,
      table: currentTable || 'غير محدد',
      createdAt: new Date(),
      status: 'pending'
    });
    activeWaiterCallId = docRef.id;
    btn.classList.add('pending');
    showToast(currentLang === 'ar' ? 'تم استدعاء الويتر، جاري الاستجابة...' : 'Waiter called, awaiting response...', '🛎️');

    const unsubCall = onSnapshot(doc(db, 'waiter_calls', activeWaiterCallId), (snap) => {
      if (snap.exists()) {
        const data = snap.data();
        if (data.status === 'done' || data.responded === true) {
          playClientBellSound();
          showToast(currentLang === 'ar' ? 'الويتر في طريقه إليك 🚶‍♂️☕' : 'Waiter is on the way! 🚶‍♂️☕', '🏃‍♂️');
          btn.style.display = 'none';
          btn.classList.remove('pending');
          activeWaiterCallId = null;
          unsubCall();
        }
      }
    });
  } catch (e) {
    console.error(e);
    btn.classList.remove('pending');
  }
}

function addToCart(id) {
  const item = allItems.find(x => x.id === id);
  if (!item) return;
  const existing = cart.find(x => x.id === id);
  const itemName = currentLang === 'ar' ? item.nameAr : (item.nameEn || item.nameAr);
  if (existing) { existing.qty += 1; }
  else { cart.push({ id: item.id, nameAr: itemName, price: getItemPrice(item), qty: 1 }); }
  localStorage.setItem('gharbaoui_cart', JSON.stringify(cart));
  updateCartBadge();
  showToast(currentLang === 'ar' ? 'تمت الإضافة للسلة' : 'Added to cart');
}

function updateCartBadge() {
  const badge = document.getElementById('cartCountBadge');
  const totalQty = cart.reduce((s, i) => s + i.qty, 0);
  if (totalQty > 0) { badge.style.display = 'flex'; badge.innerText = totalQty; }
  else { badge.style.display = 'none'; }
}

function openCartModal() {
  document.getElementById('cartSheet').classList.add('open');
  document.getElementById('cartBackdrop').classList.add('open');
  renderCartItems();
}
function closeCartModal() {
  document.getElementById('cartSheet').classList.remove('open');
  document.getElementById('cartBackdrop').classList.remove('open');
}

function renderCartItems() {
  const c = document.getElementById('cartItemsContainer');
  const footer = document.getElementById('cartFooter');
  if (!cart.length) {
    c.innerHTML = `<div style="text-align:center;color:var(--text-muted);padding:30px;">${currentLang === 'ar' ? 'سلة الطلبات فارغة' : 'Cart is empty'}</div>`;
    footer.innerHTML = '';
    return;
  }
  c.innerHTML = cart.map((i, idx) => `
    <div style="display:flex;justify-content:space-between;align-items:center;background:var(--bg-subtle);padding:10px 14px;border-radius:12px;">
      <div><strong>${i.nameAr}</strong><div style="font-size:11px;color:var(--coffee-gold);">${i.price * i.qty} ج</div></div>
      <div style="display:flex;align-items:center;gap:8px;">
        <button onclick="changeQty(${idx}, -1)" class="icon-btn" style="width:28px;height:28px;">-</button>
        <span style="font-weight:900;">${i.qty}</span>
        <button onclick="changeQty(${idx}, 1)" class="icon-btn" style="width:28px;height:28px;">+</button>
      </div>
    </div>
  `).join('');

  const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  const totalText = currentLang === 'ar' ? 'الإجمالي:' : 'Total:';
  const sendText = currentLang === 'ar' ? 'إرسال الطلب للفرع 🚀' : 'Send Order 🚀';
  footer.innerHTML = `
    <div style="display:flex;justify-content:space-between;font-weight:900;font-size:15px;margin-bottom:6px;">
      <span>${totalText}</span>
      <span style="color:var(--coffee-gold);">${total} ج</span>
    </div>
    <button class="primary-btn" onclick="submitOrder()">${sendText}</button>
  `;
}

function changeQty(idx, delta) {
  cart[idx].qty += delta;
  if (cart[idx].qty <= 0) cart.splice(idx, 1);
  localStorage.setItem('gharbaoui_cart', JSON.stringify(cart));
  updateCartBadge();
  renderCartItems();
}

async function submitOrder() {
  if (!currentBranch || !cart.length) return;
  const { db, collection, addDoc } = window.FB;
  const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
  try {
    await addDoc(collection(db, 'orders'), {
      branchId: currentBranch.id,
      branchNameAr: currentBranch.nameAr,
      table: currentTable || 'غير محدد',
      items: cart,
      total: total,
      status: 'pending',
      createdAt: new Date()
    });
    cart = [];
    localStorage.removeItem('gharbaoui_cart');
    updateCartBadge();
    closeCartModal();
    playClientBellSound();
    showToast(currentLang === 'ar' ? '✅ تم إرسال طلبك للفرع بنجاح!' : '✅ Order sent successfully!', '🎉');
  } catch (e) {
    console.error(e);
    showToast(currentLang === 'ar' ? 'حدث خطأ أثناء إرسال الطلب' : 'Error sending order', '❌');
  }
}

function enterWelcome() {
  document.getElementById('welcomeScreen').classList.add('is-hidden');
}
</script>
