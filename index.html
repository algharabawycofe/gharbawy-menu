<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#2B1D14">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title id="pageTitle">Al-Gharbawy - Digital Menu</title>
    <link rel="manifest" id="pwaManifest">
    <link rel="apple-touch-icon" href="logo-01.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

        :root {
            --bg-primary: #FAF6F0;
            --bg-surface: #FFFFFF;
            --bg-subtle: #F5EEE5;
            --text-primary: #1F1611;
            --text-secondary: #6F4E37;
            --text-muted: #A89080;
            --border: #E8DED2;
            --border-strong: #D4C4B0;
            --coffee-dark: #2B1D14;
            --coffee-medium: #6F4E37;
            --coffee-gold: #C89B5E;
            --coffee-gold-light: #E0BE85;
            --accent-danger: #B33A3A;
            --accent-success: #4A7C59;
            --shadow-sm: 0 1px 3px rgba(43, 29, 20, 0.06);
            --shadow-md: 0 4px 16px rgba(43, 29, 20, 0.08);
            --shadow-lg: 0 12px 40px rgba(43, 29, 20, 0.12);
        }

        html.dark {
            --bg-primary: #1A1310;
            --bg-surface: #241B16;
            --bg-subtle: #1F1712;
            --text-primary: #FAF6F0;
            --text-secondary: #D4A56A;
            --text-muted: #8A7566;
            --border: #3A2A20;
            --border-strong: #4A3628;
            --coffee-dark: #FAF6F0;
            --coffee-medium: #C89B5E;
            --coffee-gold: #D4A56A;
            --coffee-gold-light: #E0BE85;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
        }

        * { transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease; }

        body {
            font-family: 'Cairo', 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: env(safe-area-inset-bottom);
        }



        html.dark .waiter-overlay {
            background: var(--bg-primary);
            color: var(--text-primary);
        }
        html.dark .waiter-toolbar {
            background: color-mix(in srgb, var(--bg-surface) 96%, transparent);
            border-bottom-color: var(--border);
        }
        html.dark .waiter-close-btn {
            background: var(--bg-subtle);
            border-color: var(--border);
            color: var(--text-primary);
        }
        html.dark .waiter-brand,
        html.dark .waiter-item-name,
        html.dark .waiter-item-price,
        html.dark .waiter-time {
            color: var(--text-primary);
        }
        html.dark .waiter-subtitle,
        html.dark .waiter-order-title,
        html.dark .waiter-item-details,
        html.dark .waiter-footer {
            color: var(--text-secondary);
        }
        html.dark .waiter-item {
            border-bottom-color: var(--border-strong);
        }
        html.dark .waiter-item-qty {
            color: var(--coffee-gold);
            background: var(--bg-subtle);
            border-color: var(--border);
        }
        html.dark .waiter-item-notes {
            color: var(--coffee-gold);
            background: color-mix(in srgb, var(--coffee-gold) 10%, var(--bg-surface));
            border-inline-start-color: var(--coffee-gold);
        }
        html.dark .waiter-footer {
            border-top-color: var(--border-strong);
        }

        /* ═══════ DARK MODE VISIBILITY FIX ═══════ */
        html.dark input,
        html.dark textarea,
        html.dark select {
            color: var(--text-primary);
            background-color: var(--bg-surface);
            border-color: var(--border);
            color-scheme: dark;
        }
        html.dark input::placeholder,
        html.dark textarea::placeholder {
            color: var(--text-muted);
            opacity: 1;
        }
        html.dark option {
            color: var(--text-primary);
            background: var(--bg-surface);
        }
        html.dark .form-input:focus,
        html.dark .search-input:focus,
        html.dark .notes-input:focus {
            color: var(--text-primary);
            background-color: var(--bg-surface);
            border-color: var(--coffee-gold);
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--coffee-gold) 18%, transparent);
        }
        html.dark .menu-card,
        html.dark .skeleton-card,
        html.dark .admin-panel,
        html.dark .pill-btn,
        html.dark .qty-btn,
        html.dark .secondary-btn {
            color: var(--text-primary);
        }
        html.dark .menu-card,
        html.dark .admin-panel,
        html.dark .pill-btn,
        html.dark .qty-btn,
        html.dark .secondary-btn {
            background-color: var(--bg-surface);
            border-color: var(--border);
        }
        html.dark .bottom-nav {
            background: color-mix(in srgb, var(--bg-surface) 97%, transparent);
            border-top-color: var(--border);
        }
        html.dark .sheet-footer {
            background: var(--bg-surface);
            border-top-color: var(--border);
        }

        @media (max-width: 768px) { body { padding-bottom: 90px; } }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .header-logo-wrap { width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; overflow: hidden; flex-shrink: 0; }
        .header-logo { width: 100%; height: 100%; object-fit: contain; transform: scale(1.45); transform-origin: center; }
        @media (max-width: 640px) {
            .header-logo-wrap { width: 52px; height: 52px; }
            .header-logo { transform: scale(1.4); }
        }

        .app-header {
            background-color: color-mix(in srgb, var(--bg-surface) 92%, transparent);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 50;
        }

        .icon-btn {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: var(--bg-subtle);
            border: 1px solid var(--border);
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .icon-btn:hover { background: var(--coffee-gold); color: #FFFFFF; border-color: var(--coffee-gold); transform: translateY(-1px); }
        .icon-btn:active { transform: scale(0.94); }

        /* Dark-mode close buttons: keep the X visible on dark surfaces */
        .close-action-btn {
            color: var(--text-primary) !important;
            background: var(--bg-subtle) !important;
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow-sm);
        }
        .close-action-btn:hover {
            color: #FFFFFF !important;
            background: var(--coffee-gold) !important;
            border-color: var(--coffee-gold) !important;
        }
        html.dark .close-action-btn {
            color: #FAF6F0 !important;
            background: #3A2A20 !important;
            border-color: #4A3628 !important;
        }
        html.dark .close-action-btn:hover {
            color: #1F1611 !important;
            background: #D4A56A !important;
            border-color: #D4A56A !important;
        }

        .cart-btn-header {
            background: linear-gradient(135deg, var(--coffee-dark), var(--coffee-medium));
            color: #FFFFFF;
            padding: 0 14px;
            height: 38px;
            border-radius: 12px;
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; font-weight: 800;
            cursor: pointer;
            position: relative;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }
        html.dark .cart-btn-header { background: linear-gradient(135deg, var(--coffee-gold), var(--coffee-gold-light)); color: #1F1611; }
        .cart-btn-header:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }

        .cart-badge {
            position: absolute;
            top: -6px;
            inset-inline-end: -6px;
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 10px;
            background: var(--coffee-gold);
            color: #1F1611;
            font-size: 10px; font-weight: 900;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid var(--bg-surface);
        }
        .cart-badge.bump { animation: badgeBump 0.5s ease; }
        @keyframes badgeBump {
            0% { transform: scale(1); }
            30% { transform: scale(1.4); }
            60% { transform: scale(0.9); }
            100% { transform: scale(1); }
        }

        .app-main { max-width: 860px; margin: 0 auto; padding: 1rem; width: 100%; }

        .search-wrap { position: relative; flex: 1; }
        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            font-size: 13px;
            color: var(--text-primary);
            outline: none;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            font-family: inherit;
        }
        html[dir="rtl"] .search-input { padding: 12px 42px 12px 16px; }
        .search-input:focus { border-color: var(--coffee-gold); box-shadow: 0 0 0 4px color-mix(in srgb, var(--coffee-gold) 15%, transparent); }
        .search-input::placeholder { color: var(--text-muted); }
        .search-icon {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            inset-inline-start: 14px;
            color: var(--text-muted);
            pointer-events: none;
            font-size: 15px;
        }

        .pill-btn {
            padding: 12px 16px;
            background: var(--bg-surface);
            border: 1.5px solid var(--border);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 12px; font-weight: 800;
            cursor: pointer;
            display: flex; align-items: center; gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
            font-family: inherit;
        }
        .pill-btn:hover { border-color: var(--coffee-gold); color: var(--coffee-gold); }
        .pill-btn.active { background: var(--coffee-gold); border-color: var(--coffee-gold); color: #1F1611; }

        .cat-tab {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px; font-weight: 800;
            white-space: nowrap;
            cursor: pointer;
            border: 1.5px solid var(--border);
            background: var(--bg-surface);
            color: var(--text-secondary);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: inherit;
        }
        .cat-tab:hover { border-color: var(--coffee-gold); transform: translateY(-1px); }
        .cat-tab.active {
            background: var(--coffee-dark);
            color: var(--bg-primary);
            border-color: var(--coffee-dark);
            box-shadow: var(--shadow-md);
            transform: translateY(-1px);
        }
        html.dark .cat-tab.active { background: var(--coffee-gold); color: #1F1611; border-color: var(--coffee-gold); }

        @keyframes kenburns {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.18) translate(-2%, -1.5%); }
        }
        @keyframes kenburnsReverse {
            0%   { transform: scale(1.18) translate(2%, 1.5%); }
            100% { transform: scale(1) translate(0, 0); }
        }
        @keyframes slideProgressAnim { from { width: 0%; } to { width: 100%; } }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
        @keyframes pulseGlow { 0%, 100% { box-shadow: 0 0 0 0 rgba(200, 155, 94, 0.5); } 50% { box-shadow: 0 0 0 12px rgba(200, 155, 94, 0); } }

        .featured-carousel {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 10;
            border-radius: 24px;
            overflow: hidden;
            background: #0c0a09;
            box-shadow: var(--shadow-lg);
            isolation: isolate;
        }
        @media (min-width: 640px) { .featured-carousel { aspect-ratio: 16 / 7; } }
        .carousel-slide {
            position: absolute; inset: 0;
            opacity: 0;
            transition: opacity 1.1s ease-in-out;
            pointer-events: none;
            cursor: pointer;
        }
        .carousel-slide.active { opacity: 1; pointer-events: auto; }
        .carousel-slide img { width: 100%; height: 100%; object-fit: cover; transform-origin: center; }
        .carousel-slide.active.kenburns img { animation: kenburns 6.5s ease-out forwards; }
        .carousel-slide.active.kenburns-rev img { animation: kenburnsReverse 6.5s ease-out forwards; }
        .carousel-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(12,10,9,0.95) 0%, rgba(12,10,9,0.75) 30%, rgba(12,10,9,0.15) 65%, transparent 100%);
            pointer-events: none;
            z-index: 2;
        }
        .carousel-content {
            position: absolute;
            inset-inline: 0; bottom: 0;
            padding: 20px 20px 28px;
            color: #fff;
            z-index: 3;
        }
        @media (min-width: 640px) { .carousel-content { padding: 28px 36px 32px; } }
        .carousel-content .anim-item { opacity: 0; transform: translateY(24px); }
        .carousel-content.is-active .anim-item { animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .carousel-content .anim-item:nth-child(1) { animation-delay: 0.15s; }
        .carousel-content .anim-item:nth-child(2) { animation-delay: 0.3s; }
        .carousel-content .anim-item:nth-child(3) { animation-delay: 0.45s; }
        .carousel-content .anim-item:nth-child(4) { animation-delay: 0.6s; }

        .carousel-arrow {
            position: absolute;
            top: 50%; transform: translateY(-50%);
            width: 40px; height: 40px;
            border-radius: 50%;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.25s ease;
            z-index: 4;
            cursor: pointer;
            font-size: 20px; line-height: 1;
            font-family: inherit;
        }
        .carousel-arrow:hover { background: rgba(255,255,255,0.3); transform: translateY(-50%) scale(1.08); }
        .carousel-arrow.prev { inset-inline-start: 12px; }
        .carousel-arrow.next { inset-inline-end: 12px; }
        @media (max-width: 640px) { .carousel-arrow { width: 34px; height: 34px; font-size: 16px; } }
        .carousel-dots {
            position: absolute;
            bottom: 14px;
            inset-inline-start: 50%;
            transform: translateX(-50%);
            display: flex; gap: 6px;
            z-index: 5;
            padding: 6px 10px;
            background: rgba(12,10,9,0.45);
            backdrop-filter: blur(8px);
            border-radius: 9999px;
        }
        .carousel-dot {
            width: 7px; height: 7px;
            border-radius: 9999px;
            background: rgba(255,255,255,0.4);
            transition: all 0.35s ease;
            border: none; cursor: pointer; padding: 0;
        }
        .carousel-dot.active { background: var(--coffee-gold); width: 22px; box-shadow: 0 0 10px rgba(200,155,94,0.6); }
        .carousel-progress-track {
            position: absolute;
            top: 0; inset-inline: 0;
            height: 3px;
            background: rgba(255,255,255,0.08);
            z-index: 6;
            overflow: hidden;
        }
        .carousel-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #C89B5E, #E0BE85, #C89B5E);
            background-size: 200% 100%;
            width: 0%;
            box-shadow: 0 0 12px rgba(200,155,94,0.8);
        }
        .carousel-progress-bar.running { animation: slideProgressAnim 6s linear forwards, shimmer 2s linear infinite; }
        .featured-carousel:hover .carousel-progress-bar.running { animation-play-state: paused, running; }
        .featured-carousel:hover .carousel-slide.active img { animation-play-state: paused; }
        .featured-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: linear-gradient(135deg, #C89B5E, #E0BE85);
            color: #1F1611;
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 10px; font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(200,155,94,0.4);
            animation: pulseGlow 2.5s ease-in-out infinite;
        }

        .menu-card {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 12px;
            border: 1.5px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            transform: translateY(20px);
        }
        .menu-card.visible { opacity: 1; transform: translateY(0); }
        .menu-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--coffee-gold); }
        .menu-card.out-of-stock { opacity: 0.55; background: var(--bg-subtle); }
        .menu-card-img-wrap {
            position: relative;
            width: 88px; height: 88px;
            border-radius: 16px;
            overflow: hidden;
            flex-shrink: 0;
            background: var(--bg-subtle);
        }
        .menu-card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .menu-card:hover .menu-card-img { transform: scale(1.08); }
        .menu-card-body { flex: 1; min-width: 0; }

        .cat-chip {
            display: inline-block;
            font-size: 10px;
            font-weight: 800;
            color: var(--coffee-gold);
            background: color-mix(in srgb, var(--coffee-gold) 12%, transparent);
            padding: 3px 8px;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            line-height: 1;
            transition: transform 0.2s ease;
        }
        .fav-btn:hover { transform: scale(1.2); }
        .fav-btn.pop { animation: favPop 0.4s ease; }
        @keyframes favPop {
            0% { transform: scale(1); }
            40% { transform: scale(1.5) rotate(-8deg); }
            70% { transform: scale(0.9) rotate(4deg); }
            100% { transform: scale(1); }
        }

        .add-btn {
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; align-items: center; gap: 4px;
            font-family: inherit;
        }
        .add-btn.primary { background: linear-gradient(135deg, var(--coffee-gold), var(--coffee-gold-light)); color: #1F1611; }
        .add-btn.primary:hover { transform: translateY(-1px) scale(1.03); box-shadow: 0 6px 18px rgba(200,155,94,0.4); }
        .add-btn.remove { background: color-mix(in srgb, var(--accent-danger) 12%, transparent); color: var(--accent-danger); }
        .add-btn.remove:hover { background: var(--accent-danger); color: #fff; }
        .add-btn:active { transform: scale(0.95); }

        .stock-badge {
            position: absolute;
            top: 8px;
            inset-inline-start: 8px;
            background: var(--accent-danger);
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 4px 8px;
            border-radius: 6px;
            z-index: 2;
        }

        .admin-actions {
            position: absolute;
            top: 8px;
            inset-inline-end: 8px;
            display: flex;
            gap: 4px;
            background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
            backdrop-filter: blur(8px);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            z-index: 3;
            opacity: 0;
            transition: opacity 0.2s ease;
        }
        .menu-card:hover .admin-actions { opacity: 1; }
        @media (max-width: 768px) { .admin-actions { opacity: 1; } }

        .mini-btn {
            width: 26px; height: 26px;
            border-radius: 8px;
            border: none;
            font-size: 11px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .mini-btn.edit { background: var(--bg-subtle); color: var(--text-primary); }
        .mini-btn.edit:hover { background: var(--coffee-gold); color: #fff; }
        .mini-btn.del { background: color-mix(in srgb, var(--accent-danger) 12%, transparent); color: var(--accent-danger); }
        .mini-btn.del:hover { background: var(--accent-danger); color: #fff; }
        .mini-btn.stock { padding: 0 8px; width: auto; font-size: 10px; font-weight: 900; }

        .skeleton-card {
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 12px;
            border: 1.5px solid var(--border);
            display: flex;
            align-items: center;
            gap: 14px;
            overflow: hidden;
        }
        .skeleton-block {
            background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--border) 50%, var(--bg-subtle) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state-icon {
            font-size: 64px;
            opacity: 0.5;
            margin-bottom: 12px;
            display: block;
            animation: floatY 3s ease-in-out infinite;
        }
        @keyframes floatY {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0; right: 0;
            background: color-mix(in srgb, var(--bg-surface) 94%, transparent);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
            display: grid;
            grid-template-columns: repeat(5, 1fr);

        function $(id) { return document.getElementById(id); }

        function showToast(msg, icon = '✅') {
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span style="font-size:16px">${icon}</span><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('out');
                setTimeout(() => toast.remove(), 300);
            }, 2200);
        }

        function debounce(func, wait) {
            let t;
            return function(...args) {
                clearTimeout(t);
                t = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function initDarkMode() {
            const saved = localStorage.getItem(DARK_KEY);
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const isDark = saved === 'true' || (saved === null && prefersDark);
            setDarkMode(isDark);
        }

        function setDarkMode(on) {
            document.documentElement.classList.toggle('dark', on);
            $('darkModeBtn').innerText = on ? '☀️' : '🌙';
            $('bottomThemeIcon').innerText = on ? '☀️' : '🌙';
            localStorage.setItem(DARK_KEY, on);
            document.querySelector('meta[name="theme-color"]').setAttribute('content', on ? '#1A1310' : '#FAF6F0');
        }

        function toggleDarkMode() {
            const isDark = !document.documentElement.classList.contains('dark');
            setDarkMode(isDark);
            showToast(currentLang === 'ar' ? (isDark ? 'الوضع الليلي 🌙' : 'الوضع النهاري ☀️') : (isDark ? 'Dark Mode 🌙' : 'Light Mode ☀️'), isDark ? '🌙' : '☀️');
        }

        function setupPWAManifest() {
            const manifest = {
                name: 'Al-Gharbawy Digital Menu',
                short_name: 'Gharbawy',
                start_url: '.',
                display: 'standalone',
                background_color: '#FAF6F0',

                orientation: 'portrait',
                icons: [{ src: 'logo-01.png', sizes: '192x192 512x512', type: 'image/png', purpose: 'any maskable' }]
            };
            const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            $('pwaManifest').setAttribute('href', url);
        }

        function setupSheetDrag() {
            const handle = $('sheetHandle');
            const sheet = $('itemSheet');
            if (!handle || !sheet) return;
            let startY = 0, currentY = 0, dragging = false;
            handle.addEventListener('touchstart', (e) => {
                startY = e.touches[0].clientY;
                dragging = true;
                sheet.style.transition = 'none';
            }, { passive: true });
            handle.addEventListener('touchmove', (e) => {
                if (!dragging) return;
                currentY = e.touches[0].clientY - startY;
                if (currentY > 0) sheet.style.transform = `translateY(${currentY}px)`;
            }, { passive: true });
            handle.addEventListener('touchend', () => {
                if (!dragging) return;
                dragging = false;
                sheet.style.transition = '';
                sheet.style.transform = '';
                if (currentY > 100) closeItemSheet();
                currentY = 0;
            });
        }

                existing.quantity += qty;
            } else {
                cart.push({
                    cartKey,
                    id: item.id,
                    nameAr: item.nameAr,
                    nameEn: item.nameEn,
                    image: item.image,
                    unitPrice: item.price,
                    notes: notes || '',
                    quantity: qty

            bumpCartBadge();

            if (!item || item.inStock === false) return;

            const existing = cart.filter(c => c.id === id);
            if (existing.length > 0) {
                cart = cart.filter(c => c.id !== id);
                saveCart();
                renderCustomerMenu();
                showToast(currentLang === 'ar' ? 'تم الحذف' : 'Removed', '🗑️');

        function flyToCart(sourceEl) {
            const cartBtn = document.querySelector('[data-cart-btn]');
            if (!cartBtn || !sourceEl) return;
            const rect1 = sourceEl.getBoundingClientRect();
            const rect2 = cartBtn.getBoundingClientRect();

            const clone = document.createElement('div');
            clone.className = 'flying-item';
            clone.style.left = rect1.left + 'px';
            clone.style.top = rect1.top + 'px';
            clone.style.width = rect1.width + 'px';
            clone.style.height = rect1.height + 'px';
            clone.style.background = 'linear-gradient(135deg, #C89B5E, #E0BE85)';
            clone.style.boxShadow = '0 8px 24px rgba(200,155,94,0.5)';
            document.body.appendChild(clone);

            requestAnimationFrame(() => {
                clone.style.left = (rect2.left + rect2.width / 2 - 10) + 'px';
                clone.style.top = (rect2.top + rect2.height / 2 - 10) + 'px';
                clone.style.width = '20px';
                clone.style.height = '20px';
                clone.style.opacity = '0.4';
            });

            setTimeout(() => clone.remove(), 850);
        }

        function readImageFile(file, maxSize = 900, quality = 0.78) {
            return new Promise((resolve, reject) => {
                if (!file) return resolve(null);
                if (!file.type.startsWith('image/')) return reject(new Error('invalid-image'));
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.max(1, Math.round(img.width * scale));
                        canvas.height = Math.max(1, Math.round(img.height * scale));
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = () => reject(new Error('bad-image'));
                    img.src = reader.result;
                };
                reader.onerror = () => reject(new Error('read-error'));
                reader.readAsDataURL(file);
            });
        }

        function initFeaturedCarousel() {
            const available = menuItems.filter(i => i.inStock !== false);
            let picked = available.filter(i => FEATURED_IDS.includes(i.id));
            if (picked.length < 5) {
                const extras = available.filter(i => !FEATURED_IDS.includes(i.id));
                picked = [...picked, ...extras].slice(0, 10);
            }
            featuredItems = picked.slice(0, 12);
            if (featuredItems.length === 0) {
                $('featuredSection').classList.add('hidden-init');
                return;
            }
            $('featuredSection').classList.remove('hidden-init');
            renderSlides();
            renderDots();
            bindCarouselEvents();
            showSlide(0);
            startAutoplay();
        }

        function renderSlides() {
            $('slidesContainer').innerHTML = featuredItems.map((item, i) => {
                const kbClass = i % 2 === 0 ? 'kenburns' : 'kenburns-rev';
                return `
                    <div class="carousel-slide ${kbClass}" data-slide="${i}" onclick="openItemDetails(${item.id})">
                        <img src="${item.image}" alt="${item.nameEn}" loading="${i === 0 ? 'eager' : 'lazy'}">
                    </div>
                `;
            }).join('');
        }

        function renderDots() {
            $('slideDots').innerHTML = featuredItems.map((_, i) => `
                <button type="button" class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide(${i})"></button>
            `).join('');
        }

        function showSlide(index) {
            if (featuredItems.length === 0) return;
            currentSlide = (index + featuredItems.length) % featuredItems.length;
            document.querySelectorAll('.carousel-slide').forEach((el, i) => {
                el.classList.remove('active');
                if (i === currentSlide) {
                    const img = el.querySelector('img');
                    if (img) { img.style.animation = 'none'; void img.offsetWidth; img.style.animation = ''; }
                    el.classList.add('active');
                }
            });
            document.querySelectorAll('.carousel-dot').forEach((el, i) => {
                el.classList.toggle('active', i === currentSlide);
            });
            const item = featuredItems[currentSlide];
            const itemName = currentLang === 'en' ? item.nameEn : item.nameAr;
            const itemDesc = currentLang === 'en' ? item.descEn : item.descAr;
            const catReadable = categoryNames[item.category] ? categoryNames[item.category][currentLang] : item.category;
            const featuredLabel = currentLang === 'en' ? '⭐ Featured' : '⭐ الأكثر تميزاً';
            const detailsLabel = currentLang === 'en' ? 'View' : 'التفاصيل';
            const currency = currentLang === 'en' ? 'EGP' : 'جنيه';

            const content = $('slideContent');
            content.innerHTML = `
                <div class="anim-item" style="display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px;">
                    <span class="featured-badge">${featuredLabel}</span>
                    <span style="font-size: 10px; font-weight: 800; background: rgba(255,255,255,0.2); backdrop-filter: blur(8px); padding: 4px 10px; border-radius: 6px; color: #fff; border: 1px solid rgba(255,255,255,0.2);">${catReadable}</span>
                </div>
                <h2 class="anim-item" style="font-size: 26px; font-weight: 900; text-shadow: 0 4px 12px rgba(0,0,0,0.4); line-height: 1.1; margin: 0 0 4px; color: #fff;">${itemName}</h2>
                <p class="anim-item line-clamp-2" style="font-size: 12px; color: rgba(255,255,255,0.8); max-width: 460px; margin: 0 0 12px;">${itemDesc}</p>
                <div class="anim-item" style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
                    <span style="font-size: 24px; font-weight: 900; color: var(--coffee-gold-light); text-shadow: 0 2px 8px rgba(0,0,0,0.4);">${item.price} <span style="font-size: 12px; font-weight: 700;">${currency}</span></span>
                    <button type="button" onclick="event.stopPropagation(); openItemDetails(${item.id})" 
                            style="background: rgba(255,255,255,0.95); color: #1F1611; padding: 8px 16px; border-radius: 12px; font-size: 12px; font-weight: 900; border: none; cursor: pointer;">
                        ${detailsLabel}
                    </button>
                </div>
            `;
            content.classList.remove('is-active');
            void content.offsetWidth;
            content.classList.add('is-active');
            resetProgressBar();
        }

        function resetProgressBar() {
            const bar = $('slideProgress');
            bar.classList.remove('running');
            bar.style.width = '0%';
            void bar.offsetWidth;
            bar.classList.add('running');
        }

        function nextSlide() { showSlide(currentSlide + 1); restartAutoplay(); }
        function prevSlide() { showSlide(currentSlide - 1); restartAutoplay(); }
        function goToSlide(i) { showSlide(i); restartAutoplay(); }

        function startAutoplay() {
            stopAutoplay();
            autoplayTimer = setInterval(() => {
                if (!isCarouselPaused) showSlide(currentSlide + 1);
            }, SLIDE_DURATION);
        }
        function stopAutoplay() { if (autoplayTimer) clearInterval(autoplayTimer); autoplayTimer = null; }
        function restartAutoplay() { startAutoplay(); }

        function bindCarouselEvents() {
            const carousel = $('featuredCarousel');
            carousel.addEventListener('mouseenter', () => { isCarouselPaused = true; });
            carousel.addEventListener('mouseleave', () => { isCarouselPaused = false; });
            carousel.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                isCarouselPaused = true;
            }, { passive: true });
            carousel.addEventListener('touchend', (e) => {
                const diff = touchStartX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) { if (diff > 0) nextSlide(); else prevSlide(); }
                isCarouselPaused = false;
            }, { passive: true });
            document.addEventListener('visibilitychange', () => { isCarouselPaused = document.hidden; });
            document.addEventListener('keydown', (e) => {
                const anyOpen = $('itemSheet').classList.contains('open') || 
                                $('cartSheet').classList.contains('open') || 
                                $('editSheet').classList.contains('open') ||
                                $('waiterOverlay').classList.contains('open');
                if (!anyOpen) {
                    if (e.key === 'ArrowLeft') nextSlide();
                    if (e.key === 'ArrowRight') prevSlide();
                } else if (e.key === 'Escape') {
                    if ($('waiterOverlay').classList.contains('open')) closeWaiterView();
                    else if ($('itemSheet').classList.contains('open')) closeItemSheet();
                    else if ($('cartSheet').classList.contains('open')) closeCartModal();
                    else if ($('editSheet').classList.contains('open')) closeEditModal();
                }
            });
        }

        function renderSkeleton() {
            $('customerMenuGrid').innerHTML = Array.from({ length: 6 }).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton-block" style="width: 88px; height: 88px; border-radius: 16px;"></div>
                    <div style="flex: 1;">
                        <div class="skeleton-block" style="width: 60px; height: 14px; margin-bottom: 8px;"></div>
                        <div class="skeleton-block" style="width: 80%; height: 16px; margin-bottom: 6px;"></div>
                        <div class="skeleton-block" style="width: 60%; height: 12px; margin-bottom: 10px;"></div>
                        <div class="skeleton-block" style="width: 90px; height: 24px;"></div>
                    </div>
                </div>
            `).join('');
        }

        function renderCustomerMenu() {
            const tabsContainer = $('categoryTabs');
            tabsContainer.innerHTML = categoriesList.map(cat => {
                const catLabel = categoryNames[cat] ? categoryNames[cat][currentLang] : cat;
                const isActive = activeCategory === cat && !showOnlyFavorites;
                return `
                    <button onclick="filterCategory('${cat}')" class="cat-tab ${isActive ? 'active' : ''}">
                        ${catLabel}
                    </button>
                `;
            }).join('');
            filterMenu();
        }

        function filterCategory(cat) {
            showOnlyFavorites = false;
            $('favFilterBtn').classList.remove('active');
            document.querySelector('[data-nav="fav"]').classList.remove('active');
            activeCategory = cat;
            renderCustomerMenu();
        }

        const filterMenu = debounce(function() {
            const searchVal = ($('searchInput').value || '').toLowerCase().trim();
            const gridContainer = $('customerMenuGrid');

            let filtered = menuItems.filter(item => {
                const matchesCategory = showOnlyFavorites 
                    ? favorites.includes(item.id) 
                    : (activeCategory === 'All' || item.category === activeCategory);
                const nameMatch = (item.nameAr && item.nameAr.toLowerCase().includes(searchVal)) || 
                                  (item.nameEn && item.nameEn.toLowerCase().includes(searchVal));
                const descMatch = (item.descAr && item.descAr.toLowerCase().includes(searchVal)) || 
                                  (item.descEn && item.descEn.toLowerCase().includes(searchVal));
                return matchesCategory && (nameMatch || descMatch);
            });

            if (filtered.length === 0) {
                let emoji = '🔍';
                let title = currentLang === 'en' ? 'No items found' : 'مفيش نتائج';
                let sub = currentLang === 'en' ? 'Try another search term' : 'جرب كلمة تانية';
                if (showOnlyFavorites) {
                    emoji = '💔';
                    title = currentLang === 'en' ? 'No favorites yet' : 'لسه مضفتش للمفضلة';
                    sub = currentLang === 'en' ? 'Tap the heart on any item' : 'اضغط على القلب في أي منتج';
                }
                gridContainer.innerHTML = `
                    <div class="empty-state">
                        <span class="empty-state-icon">${emoji}</span>
                        <div style="font-size: 15px; font-weight: 900; color: var(--text-secondary); margin-bottom: 6px;">${title}</div>
                        <div style="font-size: 12px;">${sub}</div>
                    </div>
                `;
                return;
            }

            gridContainer.innerHTML = filtered.map((item, idx) => {
                const itemName = currentLang === 'en' ? item.nameEn : item.nameAr;
                const itemDesc = currentLang === 'en' ? item.descEn : item.descAr;
                const catReadable = categoryNames[item.category] ? categoryNames[item.category][currentLang] : item.category;
                const isFav = favorites.includes(item.id);
                const inStock = item.inStock !== false;
                const isInCart = cart.some(c => c.id === item.id);
                const currency = currentLang === 'en' ? 'EGP' : 'جنيه';

                let adminActions = '';
                if (isAdminMode) {
                    const stockBtnText = inStock ? '🟢' : '🔴';
                    const stockBtnClass = inStock ? 'background: var(--accent-success); color: white;' : 'background: var(--accent-danger); color: white;';
                    adminActions = `
                        <div class="admin-actions">
                            <button onclick="toggleStock(${item.id}, event)" class="mini-btn stock" style="${stockBtnClass}" title="Stock">${stockBtnText}</button>
                            <button onclick="openEditModal(${item.id}, event)" class="mini-btn edit" title="Edit">✏️</button>
                            <button onclick="deleteItem(${item.id}, event)" class="mini-btn del" title="Delete">🗑️</button>
                        </div>
                    `;
                }

                const stockBadge = inStock ? '' : `<span class="stock-badge">${currentLang === 'en' ? 'OUT' : 'نفد'}</span>`;
                let actionButton = '';
                if (!inStock) {
                    actionButton = `<span style="font-size: 10px; font-weight: 900; color: var(--accent-danger); background: color-mix(in srgb, var(--accent-danger) 12%, transparent); padding: 5px 10px; border-radius: 8px;">${currentLang === 'en' ? 'Unavailable' : 'غير متوفر'}</span>`;
                } else if (isInCart) {
                    actionButton = `<button onclick="toggleCartItemSimple(${item.id}, event)" class="add-btn remove">
                        <span>✕</span><span>${currentLang === 'en' ? 'Remove' : 'حذف'}</span>
                    </button>`;
                } else {
                    actionButton = `<button onclick="toggleCartItemSimple(${item.id}, event)" class="add-btn primary">
                        <span>+</span><span>${currentLang === 'en' ? 'Add' : 'إضافة'}</span>
                    </button>`;
                }

                return `
                    <div class="menu-card ${inStock ? '' : 'out-of-stock'}" data-idx="${idx}" onclick="openItemDetails(${item.id})">
                        ${stockBadge}
                        <div class="menu-card-img-wrap">
                            <img src="${item.image}" class="menu-card-img" loading="lazy" onerror="this.style.display='none';">
                        </div>
                        <div class="menu-card-body">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 4px;">
                                <span class="cat-chip">${catReadable}</span>
                                <button onclick="toggleFavorite(${item.id}, event)" class="fav-btn">${isFav ? '❤️' : '🤍'}</button>
                            </div>
                            <h3 style="font-size: 13px; font-weight: 900; color: var(--text-primary); margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${itemName}</h3>
                            <p style="font-size: 11px; color: var(--text-muted); margin: 3px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${itemDesc}</p>
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 8px;">
                                <span style="font-size: 14px; font-weight: 900; color: var(--coffee-gold);">${item.price} <span style="font-size: 10px; font-weight: 700;">${currency}</span></span>
                                ${actionButton}
                            </div>
                        </div>
                        ${adminActions}
                    </div>
                `;
            }).join('');

            requestAnimationFrame(() => {
                document.querySelectorAll('.menu-card').forEach((card, i) => {
                    setTimeout(() => card.classList.add('visible'), Math.min(i * 30, 600));
                });
            });
        });

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector('[data-nav="home"]').classList.add('active');
        }

        function focusSearch() {
            $('searchInput').focus();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.querySelector('[data-nav="search"]').classList.add('active');
        }
    </script>
</body>
</html>
