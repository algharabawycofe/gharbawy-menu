<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>الغرباوي - المنيو</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF6F0; --surface: #FFFFFF; --text: #1F1611; --muted: #A89080;
  --gold: #C89B5E; --dark: #2B1D14; --danger: #B33A3A; --border: #E8DED2;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); padding-bottom: 90px; }

/* Header */
header {
  background: var(--dark); color: var(--bg); padding: 20px; text-align: center;
  position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
header h1 { font-size: 24px; font-weight: 900; margin-bottom: 4px; color: var(--gold); }
header p { font-size: 14px; color: #8A7566; }
.badge-table {
  display: inline-block; background: var(--gold); color: var(--dark);
  padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; margin-top: 8px;
}

/* Categories */
.cat-scroll {
  display: flex; overflow-x: auto; gap: 10px; padding: 15px 20px;
  background: var(--surface); border-bottom: 1px solid var(--border);
  position: sticky; top: 85px; z-index: 99; scrollbar-width: none;
}
.cat-scroll::-webkit-scrollbar { display: none; }
.cat-btn {
  padding: 8px 16px; border-radius: 20px; background: var(--bg); border: 1px solid var(--border);
  color: var(--text); font-weight: 700; font-size: 14px; white-space: nowrap; cursor: pointer;
  transition: 0.2s; display: flex; align-items: center; gap: 6px;
}
.cat-btn.active { background: var(--gold); color: var(--dark); border-color: var(--gold); }

/* Items */
.container { padding: 20px; max-width: 800px; margin: 0 auto; }
.cat-title { font-size: 20px; font-weight: 900; margin: 20px 0 15px; border-bottom: 2px solid var(--gold); display: inline-block; padding-bottom: 4px; }
.items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
@media (max-width: 400px) { .items-grid { grid-template-columns: 1fr; } }

.item-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; flex-direction: column;
  position: relative;
}
.item-img { width: 100%; height: 140px; object-fit: cover; background: var(--bg); }
.item-info { padding: 12px; flex: 1; display: flex; flex-direction: column; }
.item-name { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
.item-desc { font-size: 12px; color: var(--muted); margin-bottom: 10px; flex: 1; }
.item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.item-price { font-weight: 900; color: var(--gold); font-size: 18px; }
.item-price span { font-size: 12px; font-weight: 600; }
.add-btn {
  background: var(--dark); color: var(--gold); border: none; width: 32px; height: 32px;
  border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: 0.2s;
}
.add-btn:active { transform: scale(0.9); }
.out-of-stock { opacity: 0.5; pointer-events: none; }
.out-of-stock::after {
  content: 'نفد'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: var(--danger); color: #fff; padding: 4px 12px; border-radius: 8px; font-weight: 900;
}

/* Cart Button */
.floating-cart {
  position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 500px; margin: 0 auto;
  background: var(--gold); color: var(--dark); padding: 15px 20px; border-radius: 16px;
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 900; font-size: 18px; box-shadow: 0 10px 25px rgba(200,155,94,0.4);
  cursor: pointer; z-index: 100; transform: translateY(150px); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.floating-cart.show { transform: translateY(0); }
.cart-count { background: var(--dark); color: var(--gold); padding: 2px 8px; border-radius: 10px; font-size: 14px; }

/* Cart Modal */
.cart-modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: 0.3s;
}
.cart-modal.open { opacity: 1; pointer-events: all; }
.cart-content {
  background: var(--surface); width: 100%; max-width: 500px; max-height: 85vh;
  border-radius: 24px 24px 0 0; padding: 24px; display: flex; flex-direction: column;
  transform: translateY(100%); transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.cart-modal.open .cart-content { transform: translateY(0); }
.cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.cart-title { font-size: 20px; font-weight: 900; }
.close-btn { background: var(--bg); border: none; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--text); }
.cart-items { flex: 1; overflow-y: auto; margin-bottom: 20px; }
.cart-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.cart-item-info h4 { font-size: 15px; margin-bottom: 4px; }
.cart-item-info p { font-size: 13px; color: var(--gold); font-weight: 700; }
.qty-controls { display: flex; align-items: center; gap: 10px; background: var(--bg); padding: 4px 8px; border-radius: 12px; }
.qty-btn { background: none; border: none; font-size: 18px; font-weight: 900; color: var(--text); cursor: pointer; width: 24px; }
.qty-num { font-weight: 700; font-size: 15px; width: 20px; text-align: center; }
.cart-footer { border-top: 2px dashed var(--border); padding-top: 15px; }
.cart-total { display: flex; justify-content: space-between; font-weight: 900; font-size: 20px; margin-bottom: 15px; }
.checkout-btn {
  width: 100%; background: var(--dark); color: var(--gold); border: none;
  padding: 16px; border-radius: 14px; font-size: 18px; font-weight: 900; cursor: pointer;
}
.notes-input {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
  background: var(--bg); margin-bottom: 15px; font-family: inherit; font-size: 14px; resize: none;
}

/* Splash Screen */
.splash { position: fixed; inset: 0; background: var(--dark); z-index: 999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
.splash.hide { opacity: 0; pointer-events: none; }
.splash h1 { color: var(--gold); font-size: 32px; margin-top: 20px; animation: pulse 1.5s infinite; }
.spinner { width: 40px; height: 40px; border: 4px solid rgba(200,155,94,0.3); border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>

<!-- Splash -->
<div class="splash" id="splash">
  <div class="spinner"></div>
  <h1>الغرباوي</h1>
</div>

<!-- Header -->
<header>
  <h1 id="branchName">الغرباوي</h1>
  <p>امسح، اختار، واستمتع</p>
  <div class="badge-table" id="tableBadge" style="display:none">طربيزة <span id="tableNum"></span></div>
</header>

<!-- Categories -->
<div class="cat-scroll" id="categoriesBar"></div>

<!-- Menu Items -->
<div class="container" id="menuContainer"></div>

<!-- Floating Cart -->
<div class="floating-cart" id="floatingCart" onclick="toggleCart()">
  <span>عرض السلة <span class="cart-count" id="cartCount">0</span></span>
  <span id="cartTotal">0 ج</span>
</div>

<!-- Cart Modal -->
<div class="cart-modal" id="cartModal">
  <div class="cart-content">
    <div class="cart-header">
      <div class="cart-title">سلة الطلبات</div>
      <button class="close-btn" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItemsList"></div>
    <div class="cart-footer">
      <textarea class="notes-input" id="orderNotes" placeholder="أي ملاحظات إضافية؟ (اختياري)" rows="2"></textarea>
      <div class="cart-total">
        <span>الإجمالي:</span>
        <span id="modalCartTotal">0 ج</span>
      </div>
      <button class="checkout-btn" onclick="submitOrder()" id="checkoutBtn">تأكيد الطلب</button>
    </div>
  </div>
</div>

<script type="module" src="firebase-config.js"></script>
<script>
let currentBranch = null;
let allItems = [];
let allCategories = [];
let cart = [];
let tableNum = null;

// 1. قراءة اللينك
const urlParams = new URLSearchParams(window.location.search);
const branchCode = urlParams.get('branch');
tableNum = urlParams.get('table');

if (tableNum) {
  document.getElementById('tableBadge').style.display = 'inline-block';
  document.getElementById('tableNum').innerText = tableNum;
}

// 2. تشغيل Firebase وجلب البيانات
window.addEventListener('fb-ready', async () => {
  const { db, collection, query, where, getDocs, addDoc, serverTimestamp } = window.FB;
  
  if (!branchCode) {
    alert("خطأ: لم يتم تحديد الفرع. يرجى مسح الـ QR مرة أخرى.");
    return;
  }

  try {
    // جلب الفرع
    const qBranch = query(collection(db, 'branches'), where('code', '==', branchCode));
    const branchSnap = await getDocs(qBranch);
    
    if (branchSnap.empty) {
      document.getElementById('splash').innerHTML = '<h1 style="color:red; font-size:20px;">الفرع غير موجود!</h1>';
      return;
    }

    const bDoc = branchSnap.docs[0];
    currentBranch = { id: bDoc.id, ...bDoc.data() };
    document.getElementById('branchName').innerText = currentBranch.nameAr;
    document.title = currentBranch.nameAr + " - المنيو";

    // جلب الأقسام والمنتجات
    const [catSnap, itemsSnap] = await Promise.all([
      getDocs(collection(db, 'categories')),
      getDocs(collection(db, 'menu'))
    ]);

    allCategories = catSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(c => c.menuId === currentBranch.menuId)
      .sort((a,b) => (a.order || 0) - (b.order || 0));

    allItems = itemsSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(i => i.menuId === currentBranch.menuId)
      .sort((a,b) => a.id - b.id);

    renderCategories();
    renderMenu('all');
    
    document.getElementById('splash').classList.add('hide');
  } catch (e) {
    console.error(e);
    alert("حدث خطأ في تحميل المنيو.");
  }
});

// 3. رسم الأقسام
function renderCategories() {
  const bar = document.getElementById('categoriesBar');
  let html = `<button class="cat-btn active" onclick="filterCat('all', this)">🍽️ الكل</button>`;
  allCategories.forEach(c => {
    html += `<button class="cat-btn" onclick="filterCat('${c.id}', this)">${c.icon || ''} ${c.nameAr}</button>`;
  });
  bar.innerHTML = html;
}

// 4. فلترة وعرض المنتجات
function filterCat(catId, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderMenu(catId);
}

function renderMenu(catId) {
  const container = document.getElementById('menuContainer');
  let filteredItems = catId === 'all' ? allItems : allItems.filter(i => i.categoryId === catId);
  
  if (filteredItems.length === 0) {
    container.innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:20px;">لا توجد منتجات في هذا القسم.</p>';
    return;
  }

  let html = '';
  
  if (catId === 'all') {
    // تجميع حسب القسم
    allCategories.forEach(cat => {
      const catItems = filteredItems.filter(i => i.categoryId === cat.id);
      if (catItems.length > 0) {
        html += `<div class="cat-title">${cat.icon || ''} ${cat.nameAr}</div>`;
        html += `<div class="items-grid">`;
        catItems.forEach(item => html += buildItemCard(item));
        html += `</div>`;
      }
    });
  } else {
    html += `<div class="items-grid">`;
    filteredItems.forEach(item => html += buildItemCard(item));
    html += `</div>`;
  }

  container.innerHTML = html;
}

function buildItemCard(item) {
  const isOut = item.inStock === false;
  return `
    <div class="item-card ${isOut ? 'out-of-stock' : ''}">
      <img src="${item.image}" class="item-img" loading="lazy" alt="${item.nameAr}" onerror="this.src='https://via.placeholder.com/300x200?text=No+Image'">
      <div class="item-info">
        <div class="item-name">${item.nameAr}</div>
        <div class="item-desc">${item.descAr || ''}</div>
        <div class="item-bottom">
          <div class="item-price">${item.price} <span>ج.م</span></div>
          ${!isOut ? `<button class="add-btn" onclick="addToCart('${item.id}')">+</button>` : ''}
        </div>
      </div>
    </div>
  `;
}

// 5. السلة والطلب
function addToCart(itemId) {
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;
  
  const existing = cart.find(i => i.id === itemId);
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...item, qty: 1 });
  }
  
  updateCartUI();
}

function changeQty(itemId, delta) {
  const item = cart.find(i => i.id === itemId);
  if (!item) return;
  
  item.qty += delta;
  if (item.qty <= 0) {
    cart = cart.filter(i => i.id !== itemId);
  }
  updateCartUI();
}

function updateCartUI() {
  const count = cart.reduce((sum, i) => sum + i.qty, 0);
  const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  
  document.getElementById('cartCount').innerText = count;
  document.getElementById('cartTotal').innerText = total + ' ج';
  document.getElementById('modalCartTotal').innerText = total + ' ج';
  
  const floatBtn = document.getElementById('floatingCart');
  if (count > 0) floatBtn.classList.add('show');
  else floatBtn.classList.remove('show');
  
  const list = document.getElementById('cartItemsList');
  if (cart.length === 0) {
    list.innerHTML = '<p style="text-align:center; color:var(--muted); margin-top:20px;">السلة فاضية</p>';
    return;
  }
  
  list.innerHTML = cart.map(i => `
    <div class="cart-item">
      <div class="cart-item-info">
        <h4>${i.nameAr}</h4>
        <p>${i.price * i.qty} ج.م</p>
      </div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty('${i.id}', 1)">+</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty('${i.id}', -1)">-</button>
      </div>
    </div>
  `).join('');
}

function toggleCart() {
  document.getElementById('cartModal').classList.toggle('open');
}

async function submitOrder() {
  if (cart.length === 0) return;
  const btn = document.getElementById('checkoutBtn');
  btn.innerText = 'جاري الإرسال...';
  btn.disabled = true;

  const { db, collection, addDoc, serverTimestamp } = window.FB;
  
  const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
  const notes = document.getElementById('orderNotes').value.trim();

  const orderData = {
    branchId: currentBranch.id,
    branchNameAr: currentBranch.nameAr,
    table: tableNum || null,
    items: cart.map(i => ({ nameAr: i.nameAr, price: i.price, qty: i.qty })),
    total: total,
    notes: notes,
    status: 'new',
    createdAt: serverTimestamp()
  };

  try {
    await addDoc(collection(db, 'orders'), orderData);
    
    // نجاح
    document.getElementById('cartModal').classList.remove('open');
    cart = [];
    updateCartUI();
    document.getElementById('orderNotes').value = '';
    
    // رسالة نجاح
    alert("✅ تم إرسال طلبك بنجاح! جاري التحضير...");
    
  } catch (e) {
    console.error(e);
    alert("❌ حدث خطأ أثناء إرسال الطلب، يرجى المحاولة مرة أخرى.");
  } finally {
    btn.innerText = 'تأكيد الطلب';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
